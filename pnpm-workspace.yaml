packages:
  - packages/javascript
  - packages/javascript/*
  - packages/javascript/cli/npm/*
  - packages/javascript/lumis/native/npm/*
  - benchmarks/javascript
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@shikijs/core@4.4.2'
  - '@shikijs/engine-javascript@4.4.2'
  - '@shikijs/engine-oniguruma@4.4.2'
  - '@shikijs/langs@4.4.2'
  - '@shikijs/primitive@4.4.2'
  - '@shikijs/themes@4.4.2'
  - '@shikijs/types@4.4.2'
  - shiki@4.4.2
  - '@tanstack/highlight@1.0.0'
