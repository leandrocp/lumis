run = '''
#!/usr/bin/env bash
set -euo pipefail
git ls-files -z --cached --others --exclude-standard -- '*.rs' |
    xargs -0 lizard -l rust -C 20 -L 100000 -a 100000 -i 0 -w -W .lizard-whitelist --
'''

