[tools]
actionlint = "1.7.12"
git-cliff = "2.13.1"
python = "3.11"
"aqua:Kampfkarren/selene" = "0.31.0"
stylua = "2.5.2"
tree-sitter = "0.26"

[tasks.'setup']
description = "Install dependencies and check required tools"
run = '''
#!/usr/bin/env bash
set -euo pipefail
errors=0

check_bin() {
    if command -v "$1" &>/dev/null; then
        echo "  ✓ $1"
    else
        echo "  ✗ $1 -- $2"
        errors=$((errors + 1))
    fi
}

check_tree_sitter_cli() {
    local binary mise_dir
    mise_dir="$(mise where tree-sitter 2>/dev/null || true)"
    if [[ -n "$mise_dir" && -x "$mise_dir/tree-sitter" ]]; then
        binary="$mise_dir/tree-sitter"
    elif command -v tree-sitter &>/dev/null; then
        binary="tree-sitter"
    else
        echo "  ✗ tree-sitter -- run 'mise install', or tree-sitter-cli >= 0.26 for WASM builds"
        errors=$((errors + 1))
        return
    fi

    local version raw_version major minor
    raw_version="$("$binary" --version 2>/dev/null)"
    version="${raw_version#tree-sitter }"
    version="${version%% *}"

    if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
        echo "  ✗ tree-sitter ($raw_version) -- could not determine version; need >= 0.26"
        errors=$((errors + 1))
        return
    fi

    major="${BASH_REMATCH[1]}"
    minor="${BASH_REMATCH[2]}"

    if (( major > 0 || minor >= 26 )); then
        echo "  ✓ tree-sitter ($version)"
    else
        echo "  ✗ tree-sitter ($version) -- tree-sitter-cli >= 0.26 is needed for WASM builds"
        errors=$((errors + 1))
    fi
}

echo "Checking required tools..."
check_bin cargo "https://rustup.rs"
check_bin node "https://nodejs.org"
check_bin pnpm "https://pnpm.io/installation"
check_bin mise "https://mise.jdx.dev/getting-started.html"
check_bin mix "https://elixir-lang.org/install.html"
check_bin jq "https://jqlang.org/download"
check_bin stylua "run 'mise install'"
check_bin git-cliff "run 'mise install'"
echo ""

echo "Checking optional tools..."
check_tree_sitter_cli
check_bin nvim "https://neovim.io (needed for theme generation)"
echo ""

if [ "$errors" -gt 0 ]; then
    echo "⚠ $errors tool(s) missing -- see above"
    echo ""
fi

echo "Fetching Rust dependencies..."
cargo fetch
echo ""

echo "Installing JS dependencies..."
pnpm install
echo ""

echo "Installing website dependencies..."
(cd website && pnpm install)
echo ""

echo "Installing docs site dependencies..."
(cd docs && pnpm install)
echo ""

echo "Preprocessing shared queries..."
mise run langs-preprocess-queries
echo ""

echo "Generating JS theme assets..."
pnpm --filter @lumis-sh/themes run build
echo ""

echo "Generating JS language/runtime artifacts..."
pnpm --filter @lumis-sh/lumis run build
pnpm --dir packages/javascript run build:wasm-bundles
echo ""

echo "Building the packages whose examples import them by name..."
pnpm --filter @lumis-sh/markdown-it-lumis run build
pnpm --filter @lumis-sh/rehype-lumis run build
echo ""

echo "Fetching Elixir dependencies..."
(cd packages/elixir/lumis && mix deps.get)
echo ""

echo "Done."
'''

[tasks.'elixir-nif-lock-check']
description = "Verify the packaged NIF crate resolves standalone with its lockfile"
usage = '''
flag "--fix" help="Re-resolve the lockfile against crates.io instead of reporting it stale"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
nif_dir="packages/elixir/lumis/native/lumis_nif"
tmp_dir="$(mktemp -d)"
trap 'rm -rf "$tmp_dir"' EXIT

locked_wasmtime() {
    awk '/^name = "wasmtime"$/ { getline; gsub(/[version ="]/, ""); print; exit }' "$1"
}
workspace_version="$(locked_wasmtime Cargo.lock)"

mkdir "$tmp_dir/lumis_nif"
cp "$nif_dir/Cargo.toml" "$nif_dir/Cargo.lock" "$tmp_dir/lumis_nif"
cp -R "$nif_dir/.cargo" "$nif_dir/src" "$tmp_dir/lumis_nif"

if [ "${usage_fix:-false}" = "true" ]; then
    cargo tree --manifest-path "$tmp_dir/lumis_nif/Cargo.toml" --depth 0 >/dev/null
    if [ "$(locked_wasmtime "$tmp_dir/lumis_nif/Cargo.lock")" != "$workspace_version" ]; then
        cargo update --manifest-path "$tmp_dir/lumis_nif/Cargo.toml" -p wasmtime --precise "$workspace_version"
    fi
    cp "$tmp_dir/lumis_nif/Cargo.lock" "$nif_dir/Cargo.lock"
else
    if ! cargo tree --manifest-path "$tmp_dir/lumis_nif/Cargo.toml" --locked --depth 0; then
        echo "The packaged NIF lockfile no longer satisfies its manifest. It resolves the" >&2
        echo "lumis crates from crates.io, so it can only be refreshed once the versions it" >&2
        echo "requires are published. Run: mise run elixir-nif-lock-check --fix" >&2
        exit 1
    fi
fi

nif_version="$(locked_wasmtime "$nif_dir/Cargo.lock")"
if [ -z "$workspace_version" ] || [ "$workspace_version" != "$nif_version" ]; then
    echo "wasmtime differs: workspace $workspace_version, packaged NIF $nif_version" >&2
    echo "Compiled parser caches are keyed by the wasmtime version, so the CLI, the Node" >&2
    echo "addon and the Elixir NIF would each compile and store their own copy instead of" >&2
    echo "sharing one. Run: cargo update -p wasmtime --precise <version> in both." >&2
    exit 1
fi
echo "wasmtime $workspace_version in both lockfiles"
'''

