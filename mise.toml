[tasks.'release-needed']
description = "List packages with non-chore path-scoped commits since their latest release tag"
run = '''
#!/usr/bin/env bash
set -euo pipefail
table="$(mise run release-packages)"
found=0

while IFS= read -r entry; do
    [ -n "$entry" ] || continue
    package="${entry%%|*}"
    IFS='|' read -r -a package_paths <<< "${entry#*|}"
    tag="$(git tag --list "$package/v*" --sort=-version:refname | head -n1)"

    if [ -n "$tag" ]; then
        commits="$(git log --no-merges --extended-regexp --invert-grep --grep='^chore(\(.+\))?: ' --format='%h %s' "$tag"..HEAD -- "${package_paths[@]}")"
    else
        commits="$(git log --no-merges --extended-regexp --invert-grep --grep='^chore(\(.+\))?: ' --format='%h %s' -- "${package_paths[@]}")"
    fi

    if [ -z "$commits" ]; then
        continue
    fi

    found=1
    echo "$package"
    if [ -n "$tag" ]; then
        echo "  since: $tag"
    else
        echo "  since: no tags yet"
    fi
    while IFS= read -r line; do
        echo "  $line"
    done <<< "$commits"
    echo ""
done <<< "$table"

if [ "$found" -eq 0 ]; then
    echo "No package-scoped commits found since the latest package tags."
fi
'''

[tasks.'release-version']
description = "Print the version a package's manifest declares in the working tree"
usage = '''
arg "<package>"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
package="${usage_package?}"

entry="$(mise run release-packages | awk -F'|' -v name="$package" '$1 == name')"
if [ -z "$entry" ]; then
    echo "Unknown package: $package" >&2
    exit 1
fi

IFS='|' read -r -a package_paths <<< "${entry#*|}"
directory="${package_paths[0]}"

case "${package%%-*}" in
    cargo) sed -n 's/^version = "\([^"]*\)"$/\1/p' "$directory/Cargo.toml" | head -n1 ;;
    npm) jq -r .version "$directory/package.json" ;;
    hex) sed -n 's/^  @version "\([^"]*\)"$/\1/p' "$directory/mix.exs" | head -n1 ;;
esac
'''

[tasks.'release-plan']
description = "Print the package and version of every release that can be prepared from the current branch"
run = '''
#!/usr/bin/env bash
set -euo pipefail
table="$(mise run release-packages)"

while IFS= read -r entry; do
    [ -n "$entry" ] || continue
    package="${entry%%|*}"
    IFS='|' read -r -a package_paths <<< "${entry#*|}"

    current="$(mise run release-version "$package")"

    tag="$(git tag --list "$package/v*" --sort=-version:refname | head -n1)"
    if [ -z "$tag" ]; then
        printf 'skipping %s: no %s/v* tag yet, so the first release has to be cut by hand\n' "$package" "$package" >&2
        continue
    fi

    if [ "$current" != "${tag#*/v}" ]; then
        printf 'skipping %s: %s is already prepared and %s is still the latest tag\n' "$package" "$current" "$tag" >&2
        continue
    fi

    if [ "$package" = "npm-cli" ]; then
        cargo_tag="$(git tag --list 'cargo-lumis-cli/v*' --sort=-version:refname | head -n1)"
        cargo_version="$(mise run release-version cargo-lumis-cli)"
        binary_version="$(jq -r .binaryVersion packages/javascript/cli/package.json)"
        if [ -z "$cargo_tag" ] || [ "$cargo_version" != "${cargo_tag#*/v}" ] || [ "$binary_version" != "$cargo_version" ] || ! git diff --quiet "$cargo_tag"..HEAD -- crates/lumis-cli crates/lumis-core crates/lumis-wasm-runtime; then
            printf 'skipping npm-cli: publish cargo-lumis-cli and merge align-npm-cli first\n' >&2
            continue
        fi
    fi

    include_args=()
    for path in "${package_paths[@]}"; do
        include_args+=(--include-path "$path/**/*")
    done

    next="$(git-cliff --config cliff.toml --tag-pattern "$package/v[0-9].*" --bumped-version "${include_args[@]}")"
    next="${next#*/v}"

    if [ "$next" = "$current" ]; then
        continue
    fi

    printf '%s %s\n' "$package" "$next"
done <<< "$table"
'''

[tasks.'release-prepare']
description = "Update package version files and regenerate the package changelog locally"
usage = '''
arg "<package>"
arg "<version>"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
package="${usage_package?}"
version="${usage_version?}"

entry="$(mise run release-packages | awk -F'|' -v name="$package" '$1 == name')"
if [ -z "$entry" ]; then
    echo "Unknown package: $package" >&2
    exit 1
fi

IFS='|' read -r -a package_paths <<< "${entry#*|}"
directory="${package_paths[0]}"
changelog="$directory/CHANGELOG.md"

include_args=()
for path in "${package_paths[@]}"; do
    include_args+=(--include-path "$path/**/*")
done

case "${package%%-*}" in
    cargo)
        cargo set-version --manifest-path "$directory/Cargo.toml" -p "${directory##*/}" "$version"
        mise run check-crate-deps --fix
        ;;
    npm)
        npm --prefix "$directory" version --no-git-tag-version "$version"
        ;;
    hex)
        mise run elixir-nif-lock-check --fix
        python3 -c 'from pathlib import Path; import re, sys; path = Path(sys.argv[1]); version = sys.argv[2]; content = path.read_text(); content = re.sub(r"@version \"[^\"]+\"", f"@version \"{version}\"", content, count=1); path.write_text(content)' "$directory/mix.exs" "$version"
        ;;
esac

if [ "$package" = "npm-lumis" ]; then
    cargo set-version --manifest-path packages/javascript/lumis/native/Cargo.toml -p lumis-js-native "$version"
    for native_manifest in packages/javascript/lumis/native/npm/*/package.json; do
        npm --prefix "$(dirname "$native_manifest")" version --no-git-tag-version "$version"
    done
fi

if [ "$package" = "npm-cli" ]; then
    for cli_manifest in packages/javascript/cli/npm/*/package.json; do
        npm --prefix "$(dirname "$cli_manifest")" version --no-git-tag-version "$version"
    done
fi

git-cliff --config cliff.toml --github-repo leandrocp/lumis --tag-pattern "$package/v[0-9].*" --tag "$package/v$version" --prepend "$changelog" --strip header --unreleased "${include_args[@]}"
printf 'Prepared %s %s\n' "$package" "$version"
'''
