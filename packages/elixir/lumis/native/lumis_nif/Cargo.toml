[package]
name = "lumis_nif"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
name = "lumis_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
once_cell = "1.21"
parking_lot = "0.12"
rustler = "0.38"
# Published lumis-core 2.5.0 has no `rustler` feature and lumis-wasm-runtime
# 0.2.1 has no `Executor`, so this NIF cannot resolve them from crates.io until
# the next release of each. Swap back to version requirements then.
lumis-core = { git = "https://github.com/leandrocp/lumis", branch = "refactor/share-wasm-runtime", default-features = false, features = ["all-languages", "rustler"] }
lumis-wasm-runtime = { git = "https://github.com/leandrocp/lumis", branch = "refactor/share-wasm-runtime" }

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Threshold in the root `clippy.toml`.
cognitive_complexity = "warn"
# `rustler_precompiled` builds this crate on its own, outside the workspace, so
# it cannot inherit the root lint table. Keep the two in step; the reasoning
# behind each waiver lives in the root `Cargo.toml`.
cast_possible_truncation = "allow"
implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
