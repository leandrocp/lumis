[package]
name = "lumis-js-native"
version = "0.7.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native Node.js runtime for @lumis-sh/lumis"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
lumis-core = { path = "../../../../crates/lumis-core", version = "2.5.0", features = ["all-languages"] }
lumis-wasm-runtime = { path = "../../../../crates/lumis-wasm-runtime", version = "0.3.0" }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
napi = { version = "3", default-features = false, features = ["dyn-symbols"] }

[lints]
workspace = true
