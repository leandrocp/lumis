name: Update Languages

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  push:
    tags-ignore:
      - "**"
    paths:
      - ".github/workflows/upgrade-langs.yml"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.set-matrix.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate language matrix
        id: set-matrix
        run: |
          set -euo pipefail
          languages=$(yq -o=json -I=0 \
            '[.parsers | to_entries[] | select(.value.git != null) | .key] | sort' \
            languages.toml)
          echo "Generated matrix for languages: $languages"
          echo "languages=$languages" >> "$GITHUB_OUTPUT"

  rust-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: update-langs-dev

      - name: Build dev tool
        run: >-
          cargo build --manifest-path crates/dev/Cargo.toml
          --no-default-features

  # The default query revision belongs to the whole corpus, not to any one
  # language, so it is updated once here. Doing this inside the per-language
  # matrix opened one pull request per language carrying the same diff.
  #
  # Only the upgrade takes `default`. Every language without its own
  # `[queries.<name>]` entry resolves through `queries.default`, so the fetch and
  # preprocess have to cover the whole corpus; scoping them to `default` matches
  # nothing, because `query_names()` excludes it.
  update-shared:
    needs: rust-cache
    runs-on: ubuntu-latest
    # The branch and the pull request are pushed with CI_TOKEN, and checkout
    # keeps no credentials, so GITHUB_TOKEN only ever reads this repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: update-langs-dev
          save-if: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Update default queries
        run: |
          set -euo pipefail
          mise run langs-upgrade-queries default
          mise run langs-fetch-queries
          mise run langs-preprocess-queries
          git status --short

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CI_TOKEN }}
          add-paths: |
            languages.toml
            queries/upstream
            queries/processed
            queries/override
            queries/append
          commit-message: "feat: update default queries"
          title: "feat: update default queries"
          body: |
            Automated PR for the `queries.default` revision shared by the
            language corpus.

            --
            This PR was created automatically by the update-langs workflow.
          branch: update-default-queries
          delete-branch: true
          base: main

  update-languages:
    needs: [generate-matrix, rust-cache]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.generate-matrix.outputs.languages) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: update-langs-dev
          save-if: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Update language
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          QUERY_NAME=$(yq -r \
            '.parsers[strenv(LANGUAGE)].query_name // strenv(LANGUAGE)' \
            languages.toml)
          echo "QUERY_NAME=$QUERY_NAME" >> "$GITHUB_ENV"

          mise run langs-upgrade-parsers "$LANGUAGE"
          mise run langs-upgrade-queries "$QUERY_NAME"
          mise run langs-fetch-vendored-parsers "$LANGUAGE"
          mise run langs-fetch-queries "$QUERY_NAME"
          mise run langs-preprocess-queries "$QUERY_NAME"
          mise run docs-gen-languages-md
          pnpm --filter @lumis-sh/lumis run build:generate

      - name: Check for changes
        id: check-changes
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          parser_before=$(git show HEAD:languages.toml | \
            yq -p=toml -o=json -I=0 '.parsers[strenv(LANGUAGE)]')
          parser_after=$(yq -o=json -I=0 \
            '.parsers[strenv(LANGUAGE)]' languages.toml)

          LANGUAGE_CHANGES=$(git status --porcelain -- \
            crates/lumis/Cargo.toml \
            crates/lumis-core/Cargo.toml \
            "crates/lumis/vendored_parsers/tree-sitter-$QUERY_NAME" \
            "queries/upstream/$QUERY_NAME" \
            "queries/processed/$QUERY_NAME")

          if [ "$parser_before" = "$parser_after" ] && [ -z "$LANGUAGE_CHANGES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No parser or query changes for $LANGUAGE, skipping PR"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changes detected for $LANGUAGE:"
            git status --short
            git diff --stat
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.check-changes.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CI_TOKEN }}
          add-paths: |
            languages.toml
            Cargo.lock
            crates/dev/Cargo.lock
            crates/lumis/Cargo.toml
            crates/lumis-core/Cargo.toml
            crates/lumis/vendored_parsers
            LANGUAGES.md
            queries/upstream
            queries/processed
            queries/override
            queries/append
            packages/javascript/lumis/langs
            packages/javascript/lumis/bundles
            packages/javascript/lumis/src/generated
            packages/javascript/wasm-bundle-*
          commit-message: "feat: update lang ${{ matrix.language }}"
          title: "feat: update lang ${{ matrix.language }}"
          body: |
            Automated PR to update parser and queries for **${{ matrix.language }}**.
            
            --  
            This PR was created automatically by the update-langs workflow.
          branch: update-langs-${{ matrix.language }}
          delete-branch: true
          base: main
