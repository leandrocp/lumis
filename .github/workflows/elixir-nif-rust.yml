name: Elixir NIF Rust CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "packages/elixir/lumis/native/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/elixir-nif-rust.yml"
  pull_request:
    paths:
      - "packages/elixir/lumis/native/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/elixir-nif-rust.yml"
  workflow_dispatch:

jobs:
  standalone-lock:
    name: Standalone packaged NIF lockfile
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: false

      - name: Verify standalone NIF lockfile
        run: mise run elixir-nif-lock-check

  test:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      manifest-path: 'packages/elixir/lumis/native/lumis_nif/Cargo.toml'
      msrv: '1.91'
      # Stable only on a pull request. MSRV and nightly answer "does this still
      # build for everyone we support", which is a release question, so they run
      # on main where breaking it must not reach a tag.
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  lint:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-lint.yml@main
    with:
      manifest-path: 'packages/elixir/lumis/native/lumis_nif/Cargo.toml'
      msrv: '1.91'

