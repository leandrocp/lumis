name: Rust CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - ".cargo/config.toml"
      - ".gitattributes"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "fixtures/formatter-options.json"
      - "languages.toml"
      - "queries/**"
      - "mise.toml"
      - "benchmarks/rust/Cargo.toml"
      - "packages/elixir/lumis/native/lumis_nif/Cargo.toml"
      - "packages/javascript/lumis/native/Cargo.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - ".cargo/config.toml"
      - ".gitattributes"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "fixtures/formatter-options.json"
      - "languages.toml"
      - "queries/**"
      - "mise.toml"
      - "benchmarks/rust/Cargo.toml"
      - "packages/elixir/lumis/native/lumis_nif/Cargo.toml"
      - "packages/javascript/lumis/native/Cargo.toml"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

jobs:
  test-lumis:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis/Cargo.toml'
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  test-lumis-build:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-build/Cargo.toml'
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  test-lumis-core:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-core/Cargo.toml'
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  test-lumis-cli:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-cli/Cargo.toml'
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  test-lumis-wasm-runtime:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-wasm-runtime/Cargo.toml'
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  test-source-archive:
    name: CLI from MSYS2-extracted source archive
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MSYS
          install: git libarchive
      - name: Extract the source archive with MSYS2
        shell: msys2 {0}
        env:
          MSYS: winsymlinks:deepcopy
        run: |
          set -euo pipefail
          archive_root="$(cygpath -u "$RUNNER_TEMP")/lumis-source"
          mkdir -p "$archive_root"
          git archive --format=tar HEAD > "$archive_root.tar"
          bsdtar -xf "$archive_root.tar" -C "$archive_root"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "${{ runner.temp }}/lumis-source -> target"
          shared-key: source-archive
      - name: Test the CLI from the extracted source with MSVC
        working-directory: ${{ runner.temp }}/lumis-source
        run: cargo test --locked -p lumis-cli
  check-language-catalog:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: language-catalog
      - run: >-
          cargo run --manifest-path crates/dev/Cargo.toml
          --locked --no-default-features -- gen-language-catalog --check
  test-packaged-parsers:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      MALLOC_CHECK_: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Package Lumis and the crates released with it
        run: cargo package -p lumis -p lumis-core -p lumis-build -p lumis-wasm-runtime --no-verify

      - name: Test and audit the extracted package
        shell: bash
        run: |
          set -euo pipefail

          package_root="$RUNNER_TEMP/lumis-package"
          mkdir -p "$package_root"

          for crate in lumis lumis-core lumis-build lumis-wasm-runtime; do
            archive="$(find target/package -maxdepth 1 -name "$crate-[0-9]*.crate" -print -quit)"
            test -n "$archive"
            tar -xzf "$archive" -C "$package_root"
          done

          package_dir="$(find "$package_root" -mindepth 1 -maxdepth 1 -type d -name 'lumis-[0-9]*' -print -quit)"
          test -n "$package_dir"
          test ! -e "$package_dir/.cargo/config.toml"

          # Resolve the sibling lumis crates to the tarballs built alongside this
          # one rather than to whatever is on crates.io. Publish order releases
          # them before `lumis`, so "new lumis against last release's core" is a
          # combination that never ships; testing it only fails whenever a
          # release adds core API. `mise run check-crate-deps` is what keeps each
          # `version` requirement honest.
          patches=()
          for crate in lumis-core lumis-build lumis-wasm-runtime; do
            sibling="$(find "$package_root" -mindepth 1 -maxdepth 1 -type d -name "$crate-[0-9]*" -print -quit)"
            test -n "$sibling"
            patches+=(--config "patch.crates-io.$crate.path=\"$sibling\"")
          done

          cp -R samples "$RUNNER_TEMP/samples"

          cd "$package_dir"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/lumis-package-target"
          cargo test \
            --release \
            --no-default-features \
            --features all-languages \
            "${patches[@]}" \
            languages::tests::test_all_available_languages_have_samples_and_highlight \
            -- --exact --nocapture

          metadata="$RUNNER_TEMP/lumis-package-metadata.json"
          offenders="$RUNNER_TEMP/unsafe-tree-sitter-scanners.txt"
          cargo metadata \
            --format-version 1 \
            --all-features \
            "${patches[@]}" \
            >"$metadata"
          : >"$offenders"

          while IFS=$'\t' read -r package_name package_version package_manifest; do
            dependency_dir="${package_manifest%/Cargo.toml}"

            while IFS= read -r -d '' header; do
              if ! grep -Eq \
                '_array__grow\(\(Array[[:space:]]*\*\)\(self\)' \
                "$header"; then
                continue
              fi

              source_dir="${header%/tree_sitter/array.h}"
              scanners=()
              while IFS= read -r -d '' scanner; do
                if grep -Eq \
                  'array_(assign|extend|grow_by|insert|push|reserve|splice)[[:space:]]*\(' \
                  "$scanner"; then
                  scanners+=("${scanner#"$dependency_dir"/}")
                fi
              done < <(
                find "$source_dir" \
                  -maxdepth 1 \
                  -type f \
                  \( -name 'scanner.c' -o -name 'scanner.cc' -o -name 'scanner.cpp' \) \
                  -print0
              )

              if ((${#scanners[@]} > 0)); then
                scanner_list="$(IFS=', '; echo "${scanners[*]}")"
                printf '%s\t%s\t%s\t%s\n' \
                  "$package_name" \
                  "$package_version" \
                  "$scanner_list" \
                  "${header#"$dependency_dir"/}" \
                  >>"$offenders"
              fi
            done < <(
              find "$dependency_dir" \
                -type f \
                -path '*/tree_sitter/array.h' \
                -print0
            )
          done < <(
            jq -r '
              .packages[]
              | select(.source != null)
              | [.name, .version, .manifest_path]
              | @tsv
            ' "$metadata"
          )

          if [[ -s "$offenders" ]]; then
            echo "External Tree-sitter scanners still use an aliasing-unsafe array header:" >&2
            while IFS=$'\t' read -r package_name package_version scanners header; do
              printf '  - %s %s: %s -> %s\n' \
                "$package_name" \
                "$package_version" \
                "$scanners" \
                "$header" \
                >&2
            done <"$offenders"
            exit 1
          fi

          echo "All external Tree-sitter scanners use strict-aliasing-safe array headers."
  synced-manifest:
    name: Synced formatter-options manifest
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # `crates/lumis-cli/build.rs` copies fixtures/formatter-options.json into
      # the crate so it reaches crates.io. Building re-syncs it, so the copy is
      # only ever stale in a commit.
      - run: cargo build -p lumis-cli
      - run: git diff --exit-code -- crates/lumis-cli/formatter-options.json

  # Deliberately not skipped on `chore(release):` commits, unlike the rest of
  # this file. A release commit is the one commit that writes new `version`
  # requirements, so it is the only commit where this can catch anything, and it
  # reads manifests rather than the registry, so it passes before `cargo publish`.
  crate-deps:
    name: Crate dependency requirements
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: mise run check-crate-deps

  lint:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-lint.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'Cargo.toml'
