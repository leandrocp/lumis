name: WASM Release Parser

# One parser's release. `wasm-release` calls this once per parser in its plan,
# so a parser that fails stops only itself.
#
#   build ──┬─> publish-npm
#           └─> publish-hex
#   fetch ────> publish-hex     (Hex backfill: npm already has this version)
#
# `build` and `fetch` stage both packages and store them as an artifact; the
# publish jobs only publish it. Neither staging job holds a credential, and
# neither publish job runs a grammar's C or any of this repository's tooling.
#
# Both staging jobs run the `dev` tool that `plan` compiled, rather than each
# compiling it again.
#
# npm checks a trusted publisher against the calling workflow, not this one, so
# `wasm-release.yml` stays the workflow every parser package names.
on:
  workflow_call:
    inputs:
      parser:
        description: "Parser name, as `wasm_name` in the plan"
        type: string
        required: true
      version:
        description: "The version the plan resolved"
        type: string
        required: true
      npm:
        description: "npm is missing this version"
        type: boolean
        required: true
      hex:
        description: "Hex is missing this version"
        type: boolean
        required: true
      npm_package:
        type: string
        required: true
      app:
        description: "The Hex application name"
        type: string
        required: true
    secrets:
      HEX_API_KEY:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  # Compiles the grammar once and stages both packages from that one `.wasm`,
  # so both registries ship the same bytes.
  build:
    if: inputs.npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No credential left in `.git/config`: this job runs a third-party
      # grammar's build, and pushes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: tree-sitter

      - name: Cache tree-sitter tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tree-sitter
          key: ${{ runner.os }}-tree-sitter-cli-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-tree-sitter-cli-

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev
          path: ${{ runner.temp }}/bin

      # Artifacts do not keep file modes. tree-sitter goes on PATH itself rather
      # than as a mise shim: it runs inside the grammar's clone, where no mise
      # config names it, which is why `mise run wasm-build` does the same.
      - name: Put the tools on PATH
        run: |
          chmod +x "$RUNNER_TEMP/bin/dev"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          mise where tree-sitter >> "$GITHUB_PATH"

      - name: Build
        run: dev build-wasm "$PARSER"
        env:
          PARSER: ${{ inputs.parser }}

      - name: Stage both packages
        run: |
          dev stage-wasm "$PARSER" --version "$VERSION"
          dev stage-hex-wasm "$PARSER"
        env:
          PARSER: ${{ inputs.parser }}
          VERSION: ${{ inputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-${{ inputs.parser }}
          path: |
            tmp/wasm/publish/${{ inputs.parser }}
            tmp/wasm/hex
          retention-days: 1
          if-no-files-found: error

  # Nothing to build: npm already serves this version, and Hex is staged from
  # that tarball. A rebuild would not reproduce it — `build-wasm` falls back to
  # an unlocked `npm install` for grammars that generate from `grammar.js`, so
  # the same revision can emit a different `.wasm` months later — and
  # `stage-hex-wasm` cannot tell, since a rebuild comes with a manifest that
  # describes itself.
  fetch:
    if: ${{ !inputs.npm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev
          path: ${{ runner.temp }}/bin

      # Artifacts do not keep file modes.
      - name: Put the dev tool on PATH
        run: |
          chmod +x "$RUNNER_TEMP/bin/dev"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Fetch the npm package
        run: |
          download="$RUNNER_TEMP/npm"
          mkdir -p "$download" "tmp/wasm/publish/$PARSER"
          npm pack "$NPM_PACKAGE@$VERSION" --pack-destination "$download"
          tar -xzf "$download"/*.tgz --strip-components=1 -C "tmp/wasm/publish/$PARSER"
        env:
          PARSER: ${{ inputs.parser }}
          VERSION: ${{ inputs.version }}
          NPM_PACKAGE: ${{ inputs.npm_package }}

      - name: Stage the Hex package
        run: dev stage-hex-wasm "$PARSER"
        env:
          PARSER: ${{ inputs.parser }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-${{ inputs.parser }}
          path: |
            tmp/wasm/publish/${{ inputs.parser }}
            tmp/wasm/hex
          retention-days: 1
          if-no-files-found: error

  publish-npm:
    needs: build
    if: inputs.npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-${{ inputs.parser }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      # The major, not a version: patches and minors arrive on their own, and
      # only a major is a decision. npm publishes no `lts` or `stable` tag, and
      # `latest` would let the next major land in the middle of a release.
      # Pinned at all because `lts/*` decides which npm arrives otherwise —
      # Node 24 bundles 11.19.0, and OIDC publishing needs 11.5.1 at minimum.
      - run: npm install --global npm@12

      # No `NODE_AUTH_TOKEN`: `id-token: write` is the whole credential. npm
      # exchanges the workflow's OIDC identity for a short-lived publish token,
      # which works because this package names `wasm-release.yml` as a trusted
      # publisher — `mise run npm-trust`.
      - name: Publish to npm
        run: |
          cd -- "publish/$PARSER"
          npm publish --access public --provenance
        env:
          PARSER: ${{ inputs.parser }}

  # In parallel with npm, not after it. If npm fails where Hex succeeds, the
  # next plan cannot find the definition on npm — the only registry it reads
  # definitions from — so it takes the next patch, and Hex receives the same
  # definition again under that version. One extra Hex release per run until
  # npm catches up.
  publish-hex:
    needs: [build, fetch]
    if: >-
      ${{ !cancelled() && inputs.hex &&
          (needs.build.result == 'success' || needs.fetch.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-${{ inputs.parser }}

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      # Before the key exists: both download code that has no business reading
      # it. `deps.get` because `mix hex.publish` refuses to run with a
      # dependency unchecked out, and a parser that `requires` another grammar
      # depends on that grammar's Hex package. Nothing is compiled, and the
      # package's `files` keep the download out of the tarball.
      - name: Install Hex and fetch dependencies
        run: |
          mix local.hex --force
          cd -- "hex/$APP"
          mix deps.get
        env:
          APP: ${{ inputs.app }}

      - name: Publish to Hex
        run: |
          cd -- "hex/$APP"
          mix hex.publish package --yes
        env:
          APP: ${{ inputs.app }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
