name: Generate Themes

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  push:
    tags-ignore:
      - "**"
    paths:
      - ".github/workflows/gen-themes.yml"

jobs:
  gen-themes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Install extractor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 ninja-build cmake build-essential

      - name: themes-gen
        run: echo "y" | mise run themes-gen

      - name: css-gen
        run: mise run css-gen

      - name: Build pull request body
        run: |
          {
            echo "Automated PR to update generated themes."
            echo
            echo "Updated themes:"

            changed_themes=$(git diff --name-only -- \
              themes \
              css \
              crates/lumis-themes/data \
              crates/lumis-themes-copyleft-data/data \
              crates/lumis/css \
              packages/elixir/lumis/priv/static/css \
              packages/elixir/themes/priv \
              packages/elixir/themes-copyleft/priv \
              packages/javascript/themes/pack \
              packages/javascript/themes/themes \
              packages/javascript/themes-copyleft/pack \
              packages/javascript/themes-copyleft/themes \
              | awk '{ name = $0; sub(/^.*\//, "", name); sub(/\.(json|css|ts)$/, "", name); print name }' \
              | sort -u)

            if [ -n "$changed_themes" ]; then
              printf '%s\n' "$changed_themes" | sed 's/^/- /'
            else
              echo "- No theme file changes detected"
            fi

            echo
            echo "This PR was created automatically by the gen-themes workflow."
          } > .github/gen-themes-pr-body.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CI_TOKEN }}
          add-paths: |
            themes
            css
            crates/lumis-themes/data
            crates/lumis-themes-copyleft-data/data
            crates/lumis/css
            packages/elixir/lumis/priv/static/css
            packages/elixir/themes/priv
            packages/elixir/themes-copyleft/priv
            packages/javascript/themes/pack
            packages/javascript/themes/themes
            packages/javascript/themes-copyleft/pack
            packages/javascript/themes-copyleft/themes
          commit-message: "feat(themes): update generated themes"
          title: "feat(themes): update themes"
          body-path: .github/gen-themes-pr-body.md
          branch: gen-themes
          delete-branch: true
          base: main
