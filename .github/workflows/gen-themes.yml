name: Generate Themes

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  push:
    tags-ignore:
      - "**"
    paths:
      - ".github/workflows/gen-themes.yml"

jobs:
  gen-themes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: jdx/mise-action@v5.2.2
        with:
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Install Neovim
        run: |
          sudo add-apt-repository ppa:neovim-ppa/unstable -y
          sudo apt-get update
          sudo apt-get install -y lua5.4 neovim

      - name: themes-gen
        run: echo "y" | mise run themes-gen

      - name: css-gen
        run: mise run css-gen

      - name: Build pull request body
        run: |
          {
            echo "Automated PR to update generated themes."
            echo
            echo "Updated themes:"

            changed_themes=$(git diff --name-only -- \
              themes \
              css \
              crates/lumis-core/themes \
              crates/lumis/css \
              packages/elixir/lumis/priv/static/css \
              packages/javascript/themes/themes \
              ':!themes/licenses' \
              | awk '{ name = $0; sub(/^.*\//, "", name); sub(/\.(json|css|ts)$/, "", name); print name }' \
              | sort -u)

            if [ -n "$changed_themes" ]; then
              printf '%s\n' "$changed_themes" | sed 's/^/- /'
            else
              echo "- No theme file changes detected"
            fi

            echo
            echo "This PR was created automatically by the gen-themes workflow."
          } > .github/gen-themes-pr-body.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.CI_TOKEN }}
          add-paths: |
            themes
            THEMES.md
            docs/content/reference/themes.md
            css
            crates/lumis-core/themes
            crates/lumis/css
            packages/elixir/lumis/priv/static/css
            packages/javascript/themes/themes
          commit-message: "feat(themes): update generated themes"
          title: "feat(themes): update themes"
          body-path: .github/gen-themes-pr-body.md
          branch: gen-themes
          delete-branch: true
          base: main
