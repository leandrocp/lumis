name: Stress test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parsers:
    name: Build stress parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: jdx/mise-action@v5.2.2
        with:
          install: false

      - name: Install the Tree-sitter CLI
        run: mise install tree-sitter

      - name: Cache built parsers
        uses: actions/cache@v6.1.0
        with:
          path: tmp/wasm/build
          key: wasm-parsers-${{ runner.os }}-stress-test-${{ hashFiles('languages.toml', 'mise.toml') }}
          restore-keys: |
            wasm-parsers-${{ runner.os }}-stress-test-

      - name: Build and stage corpus parsers
        run: |
          for language in cpp csv css elixir erlang gleam javascript json; do
            mise run wasm-build "$language"
            mise run wasm-stage "$language"
          done

      - name: Upload parser store
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stress-test-parser-store-${{ github.sha }}
          path: tmp/wasm/local
          if-no-files-found: error
          retention-days: 1

  stress:
    name: Stress / ${{ matrix.runtime }} / ${{ matrix.profile }}
    needs: parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [rust, cli, javascript-native, javascript-wasm, browser, elixir]
        profile: [adversarial, giant-lines, generated]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: erlef/setup-beam@v1.24.1
        if: matrix.runtime == 'elixir'
        with:
          elixir-version: "1.20.x"
          otp-version: "29.x"

      - uses: pnpm/action-setup@v6.1.0
        if: startsWith(matrix.runtime, 'javascript-') || matrix.runtime == 'browser'
        with:
          version: 11.15.1

      - name: Set up Node.js with pnpm cache
        if: startsWith(matrix.runtime, 'javascript-') || matrix.runtime == 'browser'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Node.js
        if: ${{ !(startsWith(matrix.runtime, 'javascript-') || matrix.runtime == 'browser') }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'

      - uses: jdx/mise-action@v5.2.2
        with:
          install: false

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Download parser store
        uses: actions/download-artifact@v8.0.2
        with:
          name: stress-test-parser-store-${{ github.sha }}
          path: tmp/wasm/local

      - name: Fetch Elixir dependencies
        if: matrix.runtime == 'elixir'
        working-directory: packages/elixir/lumis
        env:
          MIX_ENV: prod
        run: mix deps.get

      - name: Fetch JavaScript dependencies
        if: startsWith(matrix.runtime, 'javascript-') || matrix.runtime == 'browser'
        run: pnpm install --frozen-lockfile

      - name: Build JavaScript themes
        if: startsWith(matrix.runtime, 'javascript-') || matrix.runtime == 'browser'
        run: pnpm --filter @lumis-sh/themes run build

      - name: Install Chromium
        if: matrix.runtime == 'browser'
        run: pnpm --filter @lumis-sh/lumis exec playwright install --with-deps chromium

      - name: Run uncapped stress profile
        env:
          LUMIS_DATA_DIR: ${{ github.workspace }}/tmp/wasm/local
        run: >-
          mise run stress --
          --runtime ${{ matrix.runtime }}
          --profile ${{ matrix.profile }}
          --iterations 2
          --output "${{ github.workspace }}/target/stress-test"
          ${{ matrix.runtime == 'elixir' && matrix.profile == 'adversarial' && '--timeout-storm' || '' }}

      - name: Publish stress summary
        if: always()
        run: |
          report="target/stress-test/${{ matrix.runtime }}-${{ matrix.profile }}.json"
          if [ -f "$report" ]; then
            jq -r '
              "## Stress test: `${{ matrix.runtime }} / ${{ matrix.profile }}`\n",
              "Status: **\(.status)**\n",
              (.results[]? | "- `\(.id)`: \(.status), \(.generated.bytes // 0) source bytes, \(.outputBytes // 0) output bytes"),
              (.violations[]? | "- Violation: \(.)")
            ' "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload partial stress report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stress-test-${{ matrix.runtime }}-${{ matrix.profile }}-${{ github.sha }}
          path: |
            target/stress-test/${{ matrix.runtime }}-${{ matrix.profile }}.json
            target/stress-test/corpus/manifest.json
          if-no-files-found: warn
          retention-days: 7
