name: Stress test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "fixtures/stress-test/**"
      - "crates/**"
      - "packages/elixir/lumis/**"
      - "packages/javascript/lumis/**"
      - "queries/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "languages.toml"
      - "pnpm-lock.yaml"
      - "mise.toml"
      - ".github/workflows/stress-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parsers:
    name: Build stress parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install the Tree-sitter CLI
        run: mise install tree-sitter

      - name: Cache built parsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tmp/wasm/build
          key: wasm-parsers-${{ runner.os }}-stress-test-${{ hashFiles('languages.toml', 'mise.toml') }}
          restore-keys: |
            wasm-parsers-${{ runner.os }}-stress-test-

      - name: Build and stage corpus parsers
        run: |
          for language in cpp csv css elixir erlang gleam javascript json; do
            mise run wasm-build "$language"
            mise run wasm-stage "$language"
          done

      - name: Upload parser store
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stress-test-parser-store-${{ github.sha }}
          path: tmp/wasm/local
          if-no-files-found: error
          retention-days: 1

  stress:
    name: Stress / ${{ matrix.runtime }} / ${{ matrix.profile }}
    needs: parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [rust, cli, javascript-native, javascript-wasm, browser, elixir]
        profile: [adversarial, giant-lines, generated]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        if: matrix.runtime == 'elixir'
        with:
          elixir-version: "1.20.x"
          otp-version: "29.x"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: startsWith(matrix.runtime, 'javascript-') || matrix.runtime == 'browser'
        with:
          version: 11.15.1

      - name: Set up Node.js with pnpm cache
        if: startsWith(matrix.runtime, 'javascript-') || matrix.runtime == 'browser'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Node.js
        if: ${{ !(startsWith(matrix.runtime, 'javascript-') || matrix.runtime == 'browser') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Download parser store
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stress-test-parser-store-${{ github.sha }}
          path: tmp/wasm/local

      - name: Fetch Elixir dependencies
        if: matrix.runtime == 'elixir'
        working-directory: packages/elixir/lumis
        env:
          MIX_ENV: prod
        run: mix deps.get

      - name: Fetch JavaScript dependencies
        if: startsWith(matrix.runtime, 'javascript-') || matrix.runtime == 'browser'
        run: pnpm install --frozen-lockfile

      - name: Build JavaScript themes
        if: startsWith(matrix.runtime, 'javascript-') || matrix.runtime == 'browser'
        run: pnpm --filter @lumis-sh/themes run build

      - name: Install Chromium
        if: matrix.runtime == 'browser'
        run: pnpm --filter @lumis-sh/lumis exec playwright install --with-deps chromium

      - name: Run uncapped stress profile
        env:
          LUMIS_DATA_DIR: ${{ github.workspace }}/tmp/wasm/local
        run: >-
          mise run stress --
          --runtime ${{ matrix.runtime }}
          --profile ${{ matrix.profile }}
          --iterations 2
          --output "${{ github.workspace }}/target/stress-test"
          ${{ matrix.runtime == 'elixir' && matrix.profile == 'adversarial' && '--timeout-storm' || '' }}

      - name: Publish stress summary
        if: always()
        run: |
          report="target/stress-test/${{ matrix.runtime }}-${{ matrix.profile }}.json"
          if [ -f "$report" ]; then
            jq -r '
              "## Stress test: `${{ matrix.runtime }} / ${{ matrix.profile }}`\n",
              "Status: **\(.status)**\n",
              (.results[]? | "- `\(.id)`: \(.status), \(.generated.bytes // 0) source bytes, \(.outputBytes // 0) output bytes"),
              (.violations[]? | "- Violation: \(.)")
            ' "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload partial stress report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stress-test-${{ matrix.runtime }}-${{ matrix.profile }}-${{ github.sha }}
          path: |
            target/stress-test/${{ matrix.runtime }}-${{ matrix.profile }}.json
            target/stress-test/corpus/manifest.json
          if-no-files-found: warn
          retention-days: 7
