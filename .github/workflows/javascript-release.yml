name: JavaScript Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: npm-lumis/v0.0.1)"
        required: true
        type: string
  push:
    tags:
      - "npm-lumis/v*"
      - "npm-markdown-it-lumis/v*"
      - "npm-rehype-lumis/v*"
      - "npm-react/v*"
      - "npm-cli/v*"
      - "npm-themes/v*"
      - "npm-wasm-bundle-*/v*"

permissions:
  contents: read

jobs:
  build-native:
    if: ${{ startsWith(inputs.tag || github.ref_name, 'npm-lumis/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            library: liblumis_js_native.dylib
          - package: darwin-x64
            target: x86_64-apple-darwin
            os: macos-15-intel
            library: liblumis_js_native.dylib
          - package: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            library: liblumis_js_native.so
          - package: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            library: liblumis_js_native.so
          - package: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            library: liblumis_js_native.so
          - package: linux-x64-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            library: liblumis_js_native.so
          - package: win32-arm64-msvc
            target: aarch64-pc-windows-msvc
            os: windows-latest
            library: lumis_js_native.dll
          - package: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            os: windows-latest
            library: lumis_js_native.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ !endsWith(matrix.target, '-musl') }}
        with:
          targets: ${{ matrix.target }}

      - name: Build native runtime
        if: ${{ !endsWith(matrix.target, '-musl') }}
        run: >-
          cargo build --locked --release
          --target ${{ matrix.target }}
          -p lumis-js-native

      # Rust links musl targets against a static CRT by default, which cannot
      # produce a loadable cdylib. Node on Alpine dlopens this, so the addon has
      # to resolve musl's libc at load time like every other shared object.
      # Dropping `crt-static` then makes std unwind through `libgcc_s.so.1`, and
      # Ubuntu's musl-tools ships no musl build of it, so the link fails there
      # however `musl-gcc` is wired up. Alpine has one, so the build runs in the
      # distro the artifact targets. Each musl target has a runner of its own
      # architecture, so the container compiles natively in both cases.
      # `tree-sitter` builds wasmtime's C API through cmake, which every runner
      # image ships preinstalled and `rust:alpine` does not.
      - name: Build native runtime (musl)
        if: endsWith(matrix.target, '-musl')
        run: >-
          docker run --rm --volume "$PWD:/lumis" --workdir /lumis
          --env RUSTFLAGS=-Ctarget-feature=-crt-static
          rust:1-alpine3.22
          sh -c
          'apk add --no-cache cmake make g++ &&
          cargo build --locked --release --target ${{ matrix.target }} -p lumis-js-native'

      - name: Stage native runtime
        shell: bash
        run: |
          mkdir native-artifact
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
            "native-artifact/lumis-native.${{ matrix.package }}.node"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lumis-native-${{ matrix.package }}
          path: native-artifact/*.node
          if-no-files-found: error
          retention-days: 1

  # `@lumis-sh/cli` resolves its binary through npm rather than downloading one,
  # so the CLI is built here from the tagged tree instead of being pulled from a
  # `cargo-lumis-cli` release. Deriving the download URL from the npm version is
  # what shipped `@lumis-sh/cli` 0.5.0 and 0.6.0 against releases that did not
  # exist; nothing resolved that URL until a user installed the package.
  build-cli:
    if: ${{ startsWith(inputs.tag || github.ref_name, 'npm-cli/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
          - package: darwin-x64
            target: x86_64-apple-darwin
            os: macos-15-intel
          - package: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - package: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - package: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - package: linux-x64-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - package: win32-arm64-msvc
            target: aarch64-pc-windows-msvc
            os: windows-latest
          - package: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ !endsWith(matrix.target, '-musl') }}
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        if: ${{ !endsWith(matrix.target, '-musl') }}
        run: cargo build --locked --release --target ${{ matrix.target }} -p lumis-cli

      # Unlike the addon, the CLI keeps musl's default static CRT: it is an
      # executable, not something Node has to dlopen, so it links libc in and
      # runs on any musl host without one installed. `tree-sitter` builds
      # wasmtime's C API through cmake, which `rust:alpine` does not ship. Each
      # musl target gets a runner of its own architecture, so this compiles
      # natively rather than under emulation.
      - name: Build CLI (musl)
        if: endsWith(matrix.target, '-musl')
        run: >-
          docker run --rm --volume "$PWD:/lumis" --workdir /lumis
          rust:1-alpine3.22
          sh -c
          'apk add --no-cache cmake make g++ musl-dev &&
          cargo build --locked --release --target ${{ matrix.target }} -p lumis-cli'

      - name: Stage CLI binary
        shell: bash
        run: |
          mkdir cli-artifact
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/lumis.exe" cli-artifact/lumis.exe
          else
            cp "target/${{ matrix.target }}/release/lumis" cli-artifact/lumis
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lumis-cli-${{ matrix.package }}
          path: cli-artifact/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build-native, build-cli]
    if: >-
      ${{
        !cancelled()
        && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        && (
          needs.build-native.result == 'success'
          || needs.build-native.result == 'skipped'
        )
        && (
          needs.build-cli.result == 'success'
          || needs.build-cli.result == 'skipped'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Determine package to publish
        id: pkg
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          component="${tag%%/v*}"
          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          if [ "$component" = "npm-themes" ]; then
            set_output filter "@lumis-sh/themes"
            set_output build_filters "@lumis-sh/themes"
          elif [ "$component" = "npm-lumis" ]; then
            set_output filter "@lumis-sh/lumis"
            set_output build_filters "@lumis-sh/themes @lumis-sh/lumis"
          elif [ "$component" = "npm-markdown-it-lumis" ]; then
            set_output filter "@lumis-sh/markdown-it-lumis"
            build_filters="@lumis-sh/themes @lumis-sh/lumis"
            build_filters="$build_filters @lumis-sh/markdown-it-lumis"
            set_output build_filters "$build_filters"
          elif [ "$component" = "npm-rehype-lumis" ]; then
            set_output filter "@lumis-sh/rehype-lumis"
            build_filters="@lumis-sh/themes @lumis-sh/lumis"
            build_filters="$build_filters @lumis-sh/rehype-lumis"
            set_output build_filters "$build_filters"
          elif [ "$component" = "npm-react" ]; then
            set_output filter "@lumis-sh/react"
            build_filters="@lumis-sh/themes @lumis-sh/lumis"
            build_filters="$build_filters @lumis-sh/react"
            set_output build_filters "$build_filters"
          elif [ "$component" = "npm-cli" ]; then
            set_output filter "@lumis-sh/cli"
            set_output build_filters ""
          elif [[ "$component" == npm-wasm-bundle-* ]]; then
            set_output filter "@lumis-sh/${component#npm-}"
            # Bundle packages contain generated, publish-ready entry points.
            set_output build_filters ""
          else
            echo "Unknown component: $component" && exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publish target workspace packages
        if: steps.pkg.outputs.build_filters != ''
        env:
          BUILD_FILTERS: ${{ steps.pkg.outputs.build_filters }}
        run: |
          read -r -a packages <<< "$BUILD_FILTERS"
          for pkg in "${packages[@]}"; do
            pnpm --filter "$pkg" run build
          done

      - name: Download native runtimes
        if: steps.pkg.outputs.filter == '@lumis-sh/lumis'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: lumis-native-*
          path: native-artifacts
          merge-multiple: true

      - name: Stage native runtime packages
        if: steps.pkg.outputs.filter == '@lumis-sh/lumis'
        run: |
          for binary in native-artifacts/*.node; do
            filename="$(basename "$binary")"
            target="${filename#lumis-native.}"
            target="${target%.node}"
            cp "$binary" \
              "packages/javascript/lumis/native/npm/$target/$filename"
          done

      # The selector and main package pin these as optionalDependencies and pnpm
      # rewrites `workspace:*` at pack time, so publishing either against an
      # incomplete or drifted native set ships a tarball that cannot install.
      - name: Check native runtime packages are complete and in lockstep
        if: steps.pkg.outputs.filter == '@lumis-sh/lumis'
        run: node packages/javascript/scripts/check-native-versions.mjs

      - name: Publish native runtime packages
        if: steps.pkg.outputs.filter == '@lumis-sh/lumis'
        run: |
          published=0
          for package_dir in packages/javascript/lumis/native/npm/*; do
            if [ "$(basename "$package_dir")" = "meta" ]; then
              continue
            fi
            npm publish "$package_dir" --access public --provenance
            published=$((published + 1))
          done
          if [ "$published" -ne 8 ]; then
            echo "expected 8 platform packages, published $published" >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `pnpm --filter` exits 0 when nothing matches, so a renamed or deleted
      # selector would silently skip publishing and leave the main package
      # depending on a version that does not exist.
      - name: Publish native runtime selector
        if: steps.pkg.outputs.filter == '@lumis-sh/lumis'
        run: >-
          pnpm --filter @lumis-sh/lumis-native --fail-if-no-match publish
          --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Download CLI binaries
        if: steps.pkg.outputs.filter == '@lumis-sh/cli'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: lumis-cli-*
          path: cli-artifacts

      - name: Stage CLI platform packages
        if: steps.pkg.outputs.filter == '@lumis-sh/cli'
        run: |
          for artifact_dir in cli-artifacts/lumis-cli-*; do
            target="$(basename "$artifact_dir")"
            target="${target#lumis-cli-}"
            cp "$artifact_dir"/lumis* "packages/javascript/cli/npm/$target/"
            chmod +x "packages/javascript/cli/npm/$target"/lumis*
          done

      # The main package pins these as optionalDependencies and pnpm rewrites
      # `workspace:*` at pack time, so publishing it against an incomplete or
      # drifted set ships a tarball whose `lumis` command cannot start.
      - name: Check CLI platform packages are complete and in lockstep
        if: steps.pkg.outputs.filter == '@lumis-sh/cli'
        run: node packages/javascript/scripts/check-cli-versions.mjs

      - name: Publish CLI platform packages
        if: steps.pkg.outputs.filter == '@lumis-sh/cli'
        run: |
          published=0
          for package_dir in packages/javascript/cli/npm/*; do
            npm publish "$package_dir" --access public --provenance
            published=$((published + 1))
          done
          if [ "$published" -ne 8 ]; then
            echo "expected 8 platform packages, published $published" >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: >-
          pnpm --filter "$PACKAGE_FILTER" --fail-if-no-match publish
          --access public --no-git-checks --provenance
        env:
          PACKAGE_FILTER: ${{ steps.pkg.outputs.filter }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
