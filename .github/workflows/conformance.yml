name: Conformance

concurrency:
  group: >-
    ${{ format(
      '{0}-{1}',
      github.workflow,
      github.event.pull_request.number || github.ref
    ) }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "fixtures/api.json"
      - "fixtures/language-lookup.json"
      - "crates/**"
      - "queries/**"
      - "languages.toml"
      - "fixtures/conformance/**"
      - "packages/javascript/lumis/**"
      - "packages/javascript/package.json"
      - "packages/javascript/themes/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/elixir/lumis/**"
      - "mise.toml"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "fixtures/api.json"
      - "fixtures/language-lookup.json"
      - "crates/**"
      - "queries/**"
      - "languages.toml"
      - "fixtures/conformance/**"
      - "packages/javascript/lumis/**"
      - "packages/javascript/package.json"
      - "packages/javascript/themes/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/elixir/lumis/**"
      - "mise.toml"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:

jobs:
  conformance:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    name: Conformance (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rust
            task: test-conformance-rust
            rust: true
          - name: CLI
            task: test-conformance-cli
            rust: true
            build-parsers: true
          - name: JavaScript (Node, Wasmtime)
            task: test-conformance-javascript-native
            node: true
            rust: true
            build-parsers: true
          - name: JavaScript (web-tree-sitter)
            task: test-conformance-javascript-wasm
            node: true
            rust: true
          - name: Browser
            task: test-conformance-browser
            node: true
            browser: true
          - name: Elixir
            task: test-conformance-elixir
            rust: true
            elixir: true
            build-parsers: true
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
        if: matrix.rust

      - uses: Swatinem/rust-cache@v2.9.2
        if: matrix.rust

      - uses: erlef/setup-beam@v1.24.1
        if: matrix.elixir
        with:
          elixir-version: "1.19.x"
          otp-version: "28.x"

      - uses: pnpm/action-setup@v6.1.0
        if: matrix.node
        with:
          version: 11.15.1

      - uses: actions/setup-node@v7.1.0
        if: matrix.node
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - uses: jdx/mise-action@v5.2.2
        with:
          install: false

      - run: pnpm install --frozen-lockfile
        if: matrix.node

      - run: mix deps.get
        if: matrix.elixir
        working-directory: packages/elixir/lumis

      # The wasmtime runtimes read parsers from the store directory, so they
      # can be pointed at parsers built here rather than at the committed
      # fixtures. That is what proves a parser built from languages.toml renders
      # byte-identically to the one the fixtures were generated with.
      # mise-action runs with install: false here, so the parser toolchain has
      # to be asked for explicitly. Only the CLI is needed: `build-wasm`
      # downloads the WASI SDK itself.
      - name: Install the Tree-sitter CLI
        if: matrix.build-parsers
        run: mise install tree-sitter

      # A built parser is a pure function of its pinned revision and the
      # toolchain, so `build-wasm` records both next to the `.wasm` and reuses
      # any file whose recording still matches. That makes a stale restore safe:
      # what the key no longer covers is rebuilt, not trusted.
      - name: Cache built parsers
        if: matrix.build-parsers
        uses: actions/cache@v6.1.0
        with:
          path: tmp/wasm/build
          key: wasm-parsers-${{ runner.os }}-conformance-${{ hashFiles('languages.toml', 'mise.toml') }}
          restore-keys: |
            wasm-parsers-${{ runner.os }}-conformance-
            wasm-parsers-${{ runner.os }}-

      - name: Cache the WASI SDK
        if: matrix.build-parsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/tree-sitter
          key: ${{ runner.os }}-wasi-sdk-${{ hashFiles('crates/dev/src/wasi_sdk.rs') }}

      - name: Build and stage the parsers the corpus uses
        if: matrix.build-parsers
        id: parsers
        run: |
          set -euo pipefail
          # The parsers the committed fixtures supply, which is the set the
          # expected output was generated with. Deriving it from the fixtures'
          # events instead would miss languages a document only attempts, such
          # as the comment parser every Lua comment injects.
          parsers=$(find fixtures/test-parsers -name '*.wasm' \
            -exec basename {} .wasm \; | sed 's/^tree-sitter-//' | sort)
          echo "building: $(echo "$parsers" | tr '\n' ' ')"
          for parser in $parsers; do
            mise run wasm-build "$parser"
            mise run wasm-stage "$parser"
          done
          echo "path=$PWD/tmp/wasm/local" >> "$GITHUB_OUTPUT"

      - run: mise run ${{ matrix.task }}
        env:
          LUMIS_DATA_DIR: ${{ steps.parsers.outputs.path }}

      - uses: actions/upload-artifact@v7.0.2
        if: failure() && matrix.browser
        with:
          name: javascript-browser-conformance-results
          path: packages/javascript/lumis/test-results
          if-no-files-found: ignore
          retention-days: 7
