name: Rust Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: cargo-lumis/v0.2.1)"
        required: true
        type: string
  push:
    tags:
      - "cargo-lumis/v*"
      - "cargo-lumis-core/v*"
      - "cargo-lumis-build/v*"
      - "cargo-lumis-wasm-runtime/v*"
      - "cargo-lumis-cli/v*"

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Check crate dependency requirements
        run: mise run check-crate-deps

      - name: Determine crate to publish
        id: crate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          component="${tag%%/v*}"
          case "$component" in
            cargo-lumis)
              crate="lumis"
              manifest="crates/lumis/Cargo.toml"
              ;;
            cargo-lumis-core)
              crate="lumis-core"
              manifest="crates/lumis-core/Cargo.toml"
              ;;
            cargo-lumis-build)
              crate="lumis-build"
              manifest="crates/lumis-build/Cargo.toml"
              ;;
            cargo-lumis-wasm-runtime)
              crate="lumis-wasm-runtime"
              manifest="crates/lumis-wasm-runtime/Cargo.toml"
              ;;
            cargo-lumis-cli)
              crate="lumis-cli"
              manifest="crates/lumis-cli/Cargo.toml"
              ;;
            *)
              echo "Unknown component: $component" >&2
              exit 1
              ;;
          esac
          echo "name=$crate" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io
        run: cargo publish -p "$CRATE_NAME"
        env:
          CRATE_NAME: ${{ steps.crate.outputs.name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  align-npm-cli:
    name: Align npm CLI binary
    needs: publish
    if: startsWith(inputs.tag || github.ref_name, 'cargo-lumis-cli/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"

      - name: Update npm CLI binary version
        id: binary
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#cargo-lumis-cli/v}"
          declared="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/lumis-cli/Cargo.toml | head -n1)"
          if [ "$declared" != "$version" ]; then
            echo "$RELEASE_TAG published $version, but main declares $declared" >&2
            exit 1
          fi

          npm --prefix packages/javascript/cli pkg set "binaryVersion=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CI_TOKEN }}
          add-paths: packages/javascript/cli/package.json
          commit-message: "fix(javascript): update npm CLI binary to ${{ steps.binary.outputs.version }}"
          title: "fix(javascript): update npm CLI binary to ${{ steps.binary.outputs.version }}"
          body: "Auto-generated by rust-release workflow"
          branch: align-npm-cli
          delete-branch: true
          base: main

  refresh-nif-lock:
    name: Refresh packaged NIF lockfile
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      # A release batch publishes one crate per tag, so the earlier tags run this
      # while a later crate the NIF also requires is still unpublished and the
      # re-resolve cannot succeed. The last tag in the batch is the one that
      # opens the pull request; `Standalone packaged NIF lockfile` stays red on
      # main if none of them does.
      - name: Re-resolve the packaged NIF lockfile
        id: refresh
        run: |
          if mise run elixir-nif-lock-check --fix; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.refresh.outputs.resolved == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CI_TOKEN }}
          add-paths: packages/elixir/lumis/native/lumis_nif/Cargo.lock
          commit-message: "chore: refresh packaged NIF lockfile"
          title: "chore: refresh packaged NIF lockfile"
          body: |
            `packages/elixir/lumis/native/lumis_nif/Cargo.lock` re-resolved against
            the versions just published to crates.io.

            The packaged NIF resolves the lumis crates from the registry, so this
            can only happen after `cargo publish`. Merge it before tagging
            `hex-lumis`.

            This PR was created automatically by the rust-release workflow.
          branch: refresh-nif-lock
          delete-branch: true
          base: main
