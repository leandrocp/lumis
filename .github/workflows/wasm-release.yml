name: WASM Release

# Queued, not cancelled. A cancel between the two publish jobs leaves a parser
# on one registry and not the other, and the next plan reads registries that a
# half-finished run has already moved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "languages.toml"
      - "crates/dev/**"
      - "crates/lumis/vendored_parsers/**"
      - "queries/**"
      - "packages/javascript/lumis/bundles/**"
      - "packages/javascript/lumis/langs/**"
      - "packages/javascript/lumis/src/generated/**"
      - "packages/javascript/scripts/build-wasm-bundles.ts"
      - "templates/wasm/**"
      - "mise.toml"
      - ".github/workflows/wasm-release.yml"
      - ".github/workflows/wasm-release-parser.yml"
      - ".github/workflows/upgrade-langs.yml"
  # Plan only, never publish. Everything the plan needs — the toolchain,
  # staging the bundles, reading their manifests, reaching both registries —
  # otherwise runs for the first time after a merge, where a mistake stops a
  # release rather than a pull request.
  pull_request:
    paths:
      - "languages.toml"
      - "crates/dev/**"
      - "crates/lumis/vendored_parsers/**"
      - "queries/**"
      - "packages/javascript/lumis/bundles/**"
      - "packages/javascript/lumis/langs/**"
      - "packages/javascript/lumis/src/generated/**"
      - "packages/javascript/scripts/build-wasm-bundles.ts"
      - "templates/wasm/**"
      - "mise.toml"
      - ".github/workflows/wasm-release.yml"
      - ".github/workflows/wasm-release-parser.yml"
      - ".github/workflows/upgrade-langs.yml"
  workflow_dispatch:
    inputs:
      parser:
        description: "Parser name(s), comma-separated (leave empty for all)"
        required: false
        default: ""

jobs:
  # The same work `plan` does, on a pull request, publishing nothing.
  #
  # `plan` is guarded to `refs/heads/main`, so until now every part of it — the
  # toolchain it needs, staging the bundles, reading their manifests, reaching
  # npm and Hex — first ran after a merge. Three releases broke that way in a
  # day: a missing `pnpm`, a missing `pnpm install`, and a plan that resolved a
  # version for a package whose trusted publisher named another workflow.
  #
  # This catches the first two. It cannot catch the third: a trusted publisher
  # lives on the npm package record, and nothing short of a real publish — with
  # the credential, from the workflow that claims it — reports that the wrong
  # workflow is named. Run `mise run npm-trust` after moving a package between
  # workflows; `RELEASE.md` says why.
  #
  # No credentials and no `id-token`, so the worst a bad plan does here is fail
  # this job. It reads both registries, which is public.
  #
  # Skipped on the release-prep branches, which is the `pull_request` half of
  # the `chore(release):` guard `plan` carries for `push`. `release-prepare`
  # bumps a crate version, which rewrites `crates/dev/Cargo.lock` and so matches
  # `crates/dev/**`, but merging one publishes nothing — there is no plan to dry
  # run. The filter cannot tell that lockfile edit from a dependency update that
  # does change the planner, so the branch is what distinguishes them.
  plan-dry-run:
    if: >-
      ${{ github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-plan

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"

      - name: Stage the bundles
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/javascript run build:wasm-bundles

      # Printed to the summary because the useful review question about a
      # release-affecting change is "what would this publish", and reading it
      # off a log means opening the run.
      - name: Plan the release
        run: |
          set -euo pipefail
          plan=$(cargo run -q --manifest-path crates/dev/Cargo.toml -- wasm-release-plan "")

          {
            echo "### Release plan"
            echo
            echo '```'
            echo "$plan" | jq -r '
              (.parsers[] | "parser  \(.wasm_name) \(.version) npm=\(.npm) hex=\(.hex)"),
              (.bundles[] | "bundle  \(.bundle) \(.version) npm=\(.npm) hex=\(.hex)")
            '
            echo '```'
            echo
            printf 'Merging publishes %s parsers and %s bundles.\n' \
              "$(echo "$plan" | jq -r '.parsers | length')" \
              "$(echo "$plan" | jq -r '.bundles | length')"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$plan" | jq .

  # What to publish, and where. The version comes from the definition rather
  # than a counter: a definition already on one registry keeps the version it
  # was published under, so the other receives that same version instead of a
  # fresh one. Only a definition neither registry has seen takes the next patch.
  #
  # `workflow_dispatch` can be started from any ref, so the branch check is not
  # redundant with the `push` trigger: without it a trial run from a feature
  # branch publishes that branch's definitions, and neither registry lets a
  # version be reused afterwards.
  plan:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      parsers: ${{ steps.plan.outputs.parsers }}
      bundles: ${{ steps.plan.outputs.bundles }}
      bundles_npm: ${{ steps.plan.outputs.bundles_npm }}
      bundle_members: ${{ steps.plan.outputs.bundle_members }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-plan

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"

      # Bundles are generated, not committed, so the planner has nothing to
      # read until this runs. The version here is a placeholder: membership is
      # what the plan needs, and the version it resolves is passed back to the
      # generator when a bundle is actually published.
      - name: Stage the bundles
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/javascript run build:wasm-bundles

      - name: Plan the release
        id: plan
        env:
          PARSER_FILTER: ${{ inputs.parser }}
        run: |
          plan=$(cargo run -q --manifest-path crates/dev/Cargo.toml -- \
            wasm-release-plan "$PARSER_FILTER")
          echo "$plan" | jq -r '.parsers[] | "\(.wasm_name) \(.version) npm=\(.npm) hex=\(.hex)"'
          echo "$plan" | jq -r '.bundles[] | "\(.app) \(.version) npm=\(.npm) hex=\(.hex)"'

          # One pipeline per parser that any registry is missing, publishing to
          # whichever registries are missing it. Bundles carry no bytes, so they
          # are published rather than built.
          {
            echo "parsers=$(echo "$plan" | jq -c '[.parsers[] | {parser: .wasm_name, version: .version, npm: .npm, hex: .hex, npm_package: .npm_package, app: .hex_package}]')"
            echo "bundles_npm=$(echo "$plan" | jq -c '[.bundles[] | select(.npm) | {bundle: .bundle, version: .version}]')"
            echo "bundles=$(echo "$plan" | jq -c '[.bundles[] | select(.hex) | {bundle: .bundle, app: .app, version: .version}]')"
            echo "any=$(echo "$plan" | jq -r '.parsers | length > 0')"
            # Each bundle's npm packages, read off the bundles staged above, so
            # `bundles-ready` holds a bundle back only for its own members.
            echo "bundle_members=$(jq -cn '[inputs | {key: (.name | ltrimstr("@lumis-sh/wasm-bundle-")), value: (.dependencies | keys)}] | from_entries' tmp/wasm/npm/wasm-bundle-*/package.json)"
          } >> "$GITHUB_OUTPUT"

      # Every parser job runs this same tool, so it is compiled once, here, and
      # handed to them. Stripped, because each of them downloads it.
      - name: Keep the dev tool for the parser jobs
        if: steps.plan.outputs.any == 'true'
        run: strip -o "$RUNNER_TEMP/dev" crates/dev/target/debug/dev

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.any == 'true'
        with:
          name: dev
          path: ${{ runner.temp }}/dev
          retention-days: 1
          if-no-files-found: error

  # One pipeline per parser, in `wasm-release-parser.yml`: build once, then
  # publish to npm and Hex in parallel. A parser that fails stops its own
  # pipeline and nothing else.
  #
  # `id-token: write` is granted here only so the called workflow can pass it
  # to its npm job; its other jobs drop it.
  #
  # Twenty pipelines at once. A full run is 113 builds of a minute or two each,
  # so this is what bounds how long a release takes; other workflows can queue
  # behind it meanwhile.
  release:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.parser }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.parsers) }}
    uses: ./.github/workflows/wasm-release-parser.yml
    with:
      parser: ${{ matrix.parser }}
      version: ${{ matrix.version }}
      npm: ${{ matrix.npm }}
      hex: ${{ matrix.hex }}
      npm_package: ${{ matrix.npm_package }}
      app: ${{ matrix.app }}
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  # Which planned bundles can publish, once every parser pipeline has finished.
  # A bundle waits for its own members only: each member this run was
  # publishing to a registry has to have published there, and a parser the
  # bundle does not group cannot hold it back. Members outside the plan are
  # already published. The next run publishes whatever waits here.
  bundles-ready:
    needs: [plan, release]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          (needs.plan.outputs.bundles_npm != '[]' || needs.plan.outputs.bundles != '[]') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      npm: ${{ steps.ready.outputs.npm }}
      hex: ${{ steps.ready.outputs.hex }}
    steps:
      # A parser pipeline's jobs are named "<parser> / <job>", from the
      # `release` job's name and `wasm-release-parser.yml`.
      - name: Match each bundle against its members
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          PARSERS: ${{ needs.plan.outputs.parsers }}
          MEMBERS: ${{ needs.plan.outputs.bundle_members }}
          BUNDLES_NPM: ${{ needs.plan.outputs.bundles_npm }}
          BUNDLES_HEX: ${{ needs.plan.outputs.bundles }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "success") | .name' > "$RUNNER_TEMP/succeeded"

          ready() {
            local registry=$1 checked
            checked=$(jq -c --argjson plan "$PARSERS" --argjson members "$MEMBERS" \
              --rawfile succeeded "$RUNNER_TEMP/succeeded" --arg registry "$registry" '
              ($succeeded | split("\n")) as $done
              | map(. as $bundle | . + {waiting: [
                  $plan[]
                  | select(.[$registry])
                  | select(.npm_package | IN(($members[$bundle.bundle] // [])[]))
                  | select("\(.parser) / publish-\($registry)" | IN($done[]) | not)
                  | .npm_package
                ]})' <<< "$2")
            jq -r --arg registry "$registry" '.[] | select(.waiting != [])
              | "::warning::\($registry) bundle \(.bundle) waits for \(.waiting | join(", "))"' <<< "$checked"
            echo "$registry=$(jq -c 'map(select(.waiting == []) | del(.waiting))' <<< "$checked")" >> "$GITHUB_OUTPUT"
          }
          ready npm "$BUNDLES_NPM"
          ready hex "$BUNDLES_HEX"

  publish-npm-bundles:
    needs: bundles-ready
    if: >-
      ${{ !cancelled() && needs.bundles-ready.result == 'success' &&
          needs.bundles-ready.outputs.npm != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.bundles-ready.outputs.npm) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - run: npm install --global npm@12

      # Generated here rather than carried from `plan`, because only now is the
      # version known. A bundle is a manifest and an import list, so generating
      # it is milliseconds.
      - name: Generate the bundle
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/javascript run build:wasm-bundles \
            --bundle "$BUNDLE" --version "$VERSION"
        env:
          BUNDLE: ${{ matrix.bundle }}
          VERSION: ${{ matrix.version }}

      - name: Publish to npm
        run: |
          cd -- "tmp/wasm/npm/wasm-bundle-$BUNDLE"
          npm publish --access public --provenance
        env:
          BUNDLE: ${{ matrix.bundle }}

  # In parallel with the npm bundles, as a parser's Hex release is with its npm
  # one, and with the same cost: if a bundle's npm publish fails where Hex
  # succeeds, the next run releases that bundle to Hex again under a new patch.
  publish-hex-bundles:
    needs: bundles-ready
    if: >-
      ${{ !cancelled() && needs.bundles-ready.result == 'success' &&
          needs.bundles-ready.outputs.hex != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.bundles-ready.outputs.hex) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      # Staged, Hex installed and dependencies fetched before the key exists:
      # all three run or download code that has no business being able to read
      # it.
      #
      # `deps.get` for a package that ships no code, because `mix hex.publish`
      # refuses to run while any dependency is unchecked out — `mix hex.build`
      # does not, but there is no publish path that takes a prebuilt tarball.
      # Fetching is the whole cost: the bundle's `files` list is `mix.exs`,
      # `README.md` and `LICENSE`, so nothing is compiled and none of what this
      # downloads reaches the tarball.
      - name: Stage the bundle
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/javascript run build:wasm-bundles \
            --bundle "$BUNDLE" --version "$VERSION"
          cargo run -q --manifest-path crates/dev/Cargo.toml -- stage-hex-bundle "$BUNDLE"
          mix local.hex --force
          cd -- "tmp/wasm/hex/$APP"
          mix deps.get
        env:
          BUNDLE: ${{ matrix.bundle }}
          APP: ${{ matrix.app }}
          VERSION: ${{ matrix.version }}

      - name: Publish the bundle to Hex
        run: |
          cd -- "tmp/wasm/hex/$APP"
          mix hex.publish package --yes
        env:
          APP: ${{ matrix.app }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
