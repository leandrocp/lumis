name: WASM Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "languages.toml"
      - "crates/dev/**"
      - "crates/lumis/vendored_parsers/**"
      - "queries/**"
      - "crates/dev/**"
      - "packages/javascript/lumis/bundles/**"
      - "packages/javascript/lumis/langs/**"
      - "packages/javascript/lumis/src/generated/**"
      - "packages/javascript/wasm-bundle-*/**"
      - "mise.toml"
      - ".github/workflows/wasm-release.yml"
      - ".github/workflows/upgrade-langs.yml"
  workflow_dispatch:
    inputs:
      parser:
        description: "Parser name(s), comma-separated (leave empty for all)"
        required: false
        default: ""
      force:
        description: >-
          Publish even when the current parser revision already exists
        required: false
        default: false
        type: boolean
      publish_hex:
        description: >-
          Also publish to Hex, from the same build npm receives
        required: false
        default: false
        type: boolean

jobs:
  detect:
    if: >-
      ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
          (github.event_name != 'push' ||
           !startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-latest
    outputs:
      parsers: ${{ steps.needed.outputs.parsers }}
      skip: ${{ steps.needed.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-detect

      - name: Determine which parsers need publishing
        id: needed
        env:
          PARSER_FILTER: ${{ inputs.parser }}
          FORCE_PUBLISH: ${{ inputs.force || 'false' }}
        run: |
          needed=$(mise run wasm-publish-needed \
            "$PARSER_FILTER" \
            "$FORCE_PUBLISH")
          if [ -z "$needed" ]; then
            echo "All packages already published, nothing to build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo 'parsers=[]' >> "$GITHUB_OUTPUT"
          else
            echo "Need to build: $needed"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            json=$(echo "$needed" | tr ' ' '\n' | jq -R . | jq -sc .)
            echo "parsers=$json" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        parser: ${{ fromJson(needs.detect.outputs.parsers) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wasm-release
          add-job-id-key: false
      - name: Cache tree-sitter tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tree-sitter
          key: ${{ runner.os }}-tree-sitter-cli-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-tree-sitter-cli-

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - run: mise run wasm-publish-prepare "$PARSER"
        env:
          PARSER: ${{ matrix.parser }}

      - name: Publish to npm
        run: |
          cd -- "tmp/wasm/publish/$PARSER"
          npm publish --access public --provenance
        env:
          PARSER: ${{ matrix.parser }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Hex publishes from the same `wasm-publish-prepare` above, never its own
      # build: `stage-hex-wasm` copies the staged parser and fails if its digest
      # stops matching the manifest beside it. One build, one parser, two
      # registries — so the two cannot drift, and neither can be tampered with
      # independently of the other.
      #
      # Manual only for now. An automatic npm release does not carry Hex with
      # it, so turning this on is a deliberate act while the packages are new.
      - uses: erlef/setup-beam@5304e04ea2b355f03681464e683d92e3b2f18451 # v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hex }}
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Stage the Hex package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hex }}
        run: cargo run -q --manifest-path crates/dev/Cargo.toml -- stage-hex-wasm "$PARSER"
        env:
          PARSER: ${{ matrix.parser }}

      - name: Publish to Hex
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hex }}
        run: |
          app_name=$(cargo run -q --manifest-path crates/dev/Cargo.toml -- wasm-meta "$PARSER" \
            | grep '^hex_app=' | cut -d= -f2)
          cd -- "tmp/wasm/hex/$app_name"
          mix local.hex --force
          mix hex.publish package --yes
        env:
          PARSER: ${{ matrix.parser }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  # Bundles carry no parser bytes, only the languages they group, so they are
  # not part of the per-parser matrix above and cannot be published until the
  # parsers they depend on exist.
  hex-bundles:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hex }}
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: [web, web-extra, system, backend, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: erlef/setup-beam@5304e04ea2b355f03681464e683d92e3b2f18451 # v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Publish the bundle to Hex
        run: |
          cargo run -q --manifest-path crates/dev/Cargo.toml -- stage-hex-bundle "$BUNDLE"
          cd -- "tmp/wasm/hex/lumis_wasm_bundle_${BUNDLE//-/_}"
          mix local.hex --force
          mix hex.publish package --yes
        env:
          BUNDLE: ${{ matrix.bundle }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
