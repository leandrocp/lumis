name: WASM Release

# Queued, not cancelled. A cancel between the two publish jobs leaves a parser
# on one registry and not the other, and the next plan reads registries that a
# half-finished run has already moved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "languages.toml"
      - "crates/dev/**"
      - "crates/lumis/vendored_parsers/**"
      - "queries/**"
      - "packages/javascript/lumis/bundles/**"
      - "packages/javascript/lumis/langs/**"
      - "packages/javascript/lumis/src/generated/**"
      - "mise.toml"
      - ".github/workflows/wasm-release.yml"
      - ".github/workflows/upgrade-langs.yml"
  # Plan only, never publish. Everything the plan needs — the toolchain,
  # staging the bundles, reading their manifests, reaching both registries —
  # otherwise runs for the first time after a merge, where a mistake stops a
  # release rather than a pull request.
  pull_request:
    paths:
      - "languages.toml"
      - "crates/dev/**"
      - "crates/lumis/vendored_parsers/**"
      - "queries/**"
      - "packages/javascript/lumis/bundles/**"
      - "packages/javascript/lumis/langs/**"
      - "packages/javascript/lumis/src/generated/**"
      - "mise.toml"
      - ".github/workflows/wasm-release.yml"
      - ".github/workflows/upgrade-langs.yml"
  workflow_dispatch:
    inputs:
      parser:
        description: "Parser name(s), comma-separated (leave empty for all)"
        required: false
        default: ""

jobs:
  # The same work `plan` does, on a pull request, publishing nothing.
  #
  # `plan` is guarded to `refs/heads/main`, so until now every part of it — the
  # toolchain it needs, staging the bundles, reading their manifests, reaching
  # npm and Hex — first ran after a merge. Three releases broke that way in a
  # day: a missing `pnpm`, a missing `pnpm install`, and a plan that resolved a
  # version for a package whose trusted publisher named another workflow.
  #
  # This catches the first two. It cannot catch the third: a trusted publisher
  # lives on the npm package record, and nothing short of a real publish — with
  # the credential, from the workflow that claims it — reports that the wrong
  # workflow is named. Run `mise run npm-trust` after moving a package between
  # workflows; `RELEASE.md` says why.
  #
  # No credentials and no `id-token`, so the worst a bad plan does here is fail
  # this job. It reads both registries, which is public.
  #
  # Skipped on the release-prep branches, which is the `pull_request` half of
  # the `chore(release):` guard `plan` carries for `push`. `release-prepare`
  # bumps a crate version, which rewrites `crates/dev/Cargo.lock` and so matches
  # `crates/dev/**`, but merging one publishes nothing — there is no plan to dry
  # run. The filter cannot tell that lockfile edit from a dependency update that
  # does change the planner, so the branch is what distinguishes them.
  plan-dry-run:
    if: >-
      ${{ github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-plan

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"

      - name: Stage the bundles
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/javascript run build:wasm-bundles

      # Printed to the summary because the useful review question about a
      # release-affecting change is "what would this publish", and reading it
      # off a log means opening the run.
      - name: Plan the release
        run: |
          set -euo pipefail
          plan=$(cargo run -q --manifest-path crates/dev/Cargo.toml -- wasm-release-plan "")

          {
            echo "### Release plan"
            echo
            echo '```'
            echo "$plan" | jq -r '
              (.parsers[] | "parser  \(.wasm_name) \(.version) npm=\(.npm) hex=\(.hex)"),
              (.bundles[] | "bundle  \(.bundle) \(.version) npm=\(.npm) hex=\(.hex)")
            '
            echo '```'
            echo
            printf 'Merging publishes %s parsers and %s bundles.\n' \
              "$(echo "$plan" | jq -r '.parsers | length')" \
              "$(echo "$plan" | jq -r '.bundles | length')"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$plan" | jq .

  # What to publish, and where. The version comes from the definition rather
  # than a counter: a definition already on one registry keeps the version it
  # was published under, so the other receives that same version instead of a
  # fresh one. Only a definition neither registry has seen takes the next patch.
  #
  # `workflow_dispatch` can be started from any ref, so the branch check is not
  # redundant with the `push` trigger: without it a trial run from a feature
  # branch publishes that branch's definitions, and neither registry lets a
  # version be reused afterwards.
  plan:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      npm: ${{ steps.plan.outputs.npm }}
      hex: ${{ steps.plan.outputs.hex }}
      bundles: ${{ steps.plan.outputs.bundles }}
      bundles_npm: ${{ steps.plan.outputs.bundles_npm }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-plan

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"

      # Bundles are generated, not committed, so the planner has nothing to
      # read until this runs. The version here is a placeholder: membership is
      # what the plan needs, and the version it resolves is passed back to the
      # generator when a bundle is actually published.
      - name: Stage the bundles
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/javascript run build:wasm-bundles

      - name: Plan the release
        id: plan
        env:
          PARSER_FILTER: ${{ inputs.parser }}
        run: |
          plan=$(cargo run -q --manifest-path crates/dev/Cargo.toml -- \
            wasm-release-plan "$PARSER_FILTER")
          echo "$plan" | jq -r '.parsers[] | "\(.wasm_name) \(.version) npm=\(.npm) hex=\(.hex)"'
          echo "$plan" | jq -r '.bundles[] | "\(.app) \(.version) npm=\(.npm) hex=\(.hex)"'

          # One build per parser that any registry is missing; one publish job
          # per registry that is missing it. Bundles carry no bytes, so they are
          # published rather than built.
          {
            echo "build=$(echo "$plan" | jq -c '[.parsers[] | {parser: .wasm_name, version: .version, npm: .npm, npm_package: .npm_package}]')"
            echo "npm=$(echo "$plan" | jq -c '[.parsers[] | select(.npm) | {parser: .wasm_name, version: .version}]')"
            echo "hex=$(echo "$plan" | jq -c '[.parsers[] | select(.hex) | {parser: .wasm_name, version: .version, app: .hex_package}]')"
            echo "bundles_npm=$(echo "$plan" | jq -c '[.bundles[] | select(.npm) | {bundle: .bundle, version: .version}]')"
            echo "bundles=$(echo "$plan" | jq -c '[.bundles[] | select(.hex) | {bundle: .bundle, app: .app, version: .version}]')"
            echo "any=$(echo "$plan" | jq -r '.parsers | length > 0')"
          } >> "$GITHUB_OUTPUT"

  # Built once, at the version the plan resolved, and carried to the publish
  # jobs as an artifact. Both registries receive bytes from this one build
  # rather than each rebuilding and hoping the results match.
  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.plan.outputs.build) }}
    steps:
      # Nothing here pushes, and this job compiles 113 third-party grammars and
      # runs their cargo build scripts. None of that needs a credential for this
      # repository, so it does not get one left in `.git/config`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wasm-release
          add-job-id-key: false

      - name: Cache tree-sitter tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tree-sitter
          key: ${{ runner.os }}-tree-sitter-cli-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-tree-sitter-cli-

      # A parser npm already serves at this version is not rebuilt: the
      # published tarball is unpacked and Hex is staged from those bytes.
      # Rebuilding would only be equivalent if the build were reproducible, and
      # it is not — `build-wasm` falls back to an unlocked `npm install` for the
      # grammars that generate from `grammar.js` and ship no usable lockfile, so
      # a rebuild months later can resolve different tooling and emit a
      # different `.wasm`. `stage-hex-wasm` checks the staged bytes against the
      # manifest beside them, which cannot catch that, because a rebuild
      # produces a manifest describing itself. Taking the bytes from npm is what
      # makes "one parser, two registries" true rather than hoped for, and it
      # skips the compile for every backfilled parser.
      - name: Build and stage both packages
        run: |
          if [ "$NPM" = "true" ]; then
            mise run wasm-build "$PARSER"
            cargo run -q --manifest-path crates/dev/Cargo.toml -- \
              stage-wasm "$PARSER" --version "$VERSION"
          else
            download="$RUNNER_TEMP/npm/$PARSER"
            mkdir -p "$download" "tmp/wasm/publish/$PARSER"
            npm pack "$NPM_PACKAGE@$VERSION" --pack-destination "$download"
            tar -xzf "$download"/*.tgz --strip-components=1 \
              -C "tmp/wasm/publish/$PARSER"
          fi
          cargo run -q --manifest-path crates/dev/Cargo.toml -- stage-hex-wasm "$PARSER"
        env:
          PARSER: ${{ matrix.parser }}
          VERSION: ${{ matrix.version }}
          NPM: ${{ matrix.npm }}
          NPM_PACKAGE: ${{ matrix.npm_package }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-${{ matrix.parser }}
          path: |
            tmp/wasm/publish/${{ matrix.parser }}
            tmp/wasm/hex
          retention-days: 1
          if-no-files-found: error

  # `!cancelled()` rather than the implied `success()`: a matrix job's result is
  # `failure` when any one leg fails, so without it a single parser that cannot
  # build would skip the publish for every other parser in the plan. The legs
  # whose artifact is missing fail at `download-artifact`, which is the blast
  # radius each parser had when it published inside its own build leg.
  publish-npm:
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.npm != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.npm) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-${{ matrix.parser }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      # The major, not a version: patches and minors arrive on their own, and
      # only a major is a decision. npm publishes no `lts` or `stable` tag, and
      # `latest` would let the next major land in the middle of a release.
      # Pinned at all because `lts/*` decides which npm arrives otherwise —
      # Node 24 bundles 11.19.0, and OIDC publishing needs 11.5.1 at minimum.
      - run: npm install --global npm@12

      # No `NODE_AUTH_TOKEN`: the `id-token: write` above is the whole
      # credential. npm exchanges the workflow's OIDC identity for a
      # short-lived publish token, which only works because this package names
      # this workflow as a trusted publisher — `mise run npm-trust`.
      #
      # No build step either: this job holds the credential, so it publishes the
      # artifact `build` staged and runs nothing of its own.
      - name: Publish to npm
        run: |
          cd -- "publish/$PARSER"
          npm publish --access public --provenance
        env:
          PARSER: ${{ matrix.parser }}

  # After npm, so Hex can never hold a definition npm does not. `plan` recovers
  # the version a definition was published under from npm alone — Hex's registry
  # file carries versions and nothing else — so a parser Hex had and npm did not
  # would look unpublished, take a fresh patch, and release an unchanged
  # definition to Hex again on every run. A failed npm leg therefore holds Hex
  # back for the whole plan rather than letting it get ahead; the next run
  # publishes both.
  publish-hex:
    needs: [plan, build, publish-npm]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.hex != '[]' &&
          needs.publish-npm.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.hex) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-${{ matrix.parser }}

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      # Hex installed before the key exists, because `mix local.hex` fetches and
      # runs code that has no business being able to read it.
      - name: Install Hex
        run: mix local.hex --force

      - name: Publish to Hex
        run: |
          cd -- "hex/$APP"
          mix hex.publish package --yes
        env:
          APP: ${{ matrix.app }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  # After the parsers on npm, for the same reason the Hex bundles wait for Hex:
  # a bundle resolves nothing until the packages it groups are published.
  publish-npm-bundles:
    needs: [plan, publish-npm]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.bundles_npm != '[]' &&
          needs.publish-npm.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.bundles_npm) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - run: npm install --global npm@12

      # Generated here rather than carried from `plan`, because only now is the
      # version known. A bundle is a manifest and an import list, so generating
      # it is milliseconds.
      - name: Generate the bundle
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/javascript run build:wasm-bundles \
            --bundle "$BUNDLE" --version "$VERSION"
        env:
          BUNDLE: ${{ matrix.bundle }}
          VERSION: ${{ matrix.version }}

      - name: Publish to npm
        run: |
          cd -- "tmp/wasm/npm/wasm-bundle-$BUNDLE"
          npm publish --access public --provenance
        env:
          BUNDLE: ${{ matrix.bundle }}

  # After the parsers, because a bundle depends on every language it groups and
  # cannot resolve until they are on Hex. `skipped` has to be told apart from
  # `success` here: `publish-hex` is also skipped when the plan has no parsers
  # for Hex, which is the one case where publishing bundles alone is right.
  publish-hex-bundles:
    needs: [plan, publish-hex, publish-npm-bundles]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.bundles != '[]' &&
          needs.publish-npm-bundles.result != 'failure' &&
          (needs.plan.outputs.hex == '[]' || needs.publish-hex.result == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.bundles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      # Staged, Hex installed and dependencies fetched before the key exists:
      # all three run or download code that has no business being able to read
      # it.
      #
      # `deps.get` for a package that ships no code, because `mix hex.publish`
      # refuses to run while any dependency is unchecked out — `mix hex.build`
      # does not, but there is no publish path that takes a prebuilt tarball.
      # Fetching is the whole cost: the bundle's `files` list is `mix.exs`,
      # `README.md` and `LICENSE`, so nothing is compiled and none of what this
      # downloads reaches the tarball.
      - name: Stage the bundle
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/javascript run build:wasm-bundles \
            --bundle "$BUNDLE" --version "$VERSION"
          cargo run -q --manifest-path crates/dev/Cargo.toml -- stage-hex-bundle "$BUNDLE"
          mix local.hex --force
          cd -- "tmp/wasm/hex/$APP"
          mix deps.get
        env:
          BUNDLE: ${{ matrix.bundle }}
          APP: ${{ matrix.app }}
          VERSION: ${{ matrix.version }}

      - name: Publish the bundle to Hex
        run: |
          cd -- "tmp/wasm/hex/$APP"
          mix hex.publish package --yes
        env:
          APP: ${{ matrix.app }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
