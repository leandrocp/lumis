name: WASM Release

# Queued, not cancelled. A cancel between the two publish jobs leaves a parser
# on one registry and not the other, and the next plan reads registries that a
# half-finished run has already moved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

on:
  push:
    branches: [main]
    # Path filters do not apply to tags, which `release-tag.yml` pushes.
    tags: ["npm-wasm-bundle-*/v*", "hex-wasm-bundle-*/v*"]
    paths:
      - "languages.toml"
      - "crates/dev/**"
      - "crates/lumis/vendored_parsers/**"
      - "queries/**"
      - "packages/javascript/lumis/bundles/**"
      - "packages/javascript/lumis/langs/**"
      - "packages/javascript/lumis/src/generated/**"
      - "packages/javascript/scripts/build-wasm-bundles.ts"
      - "templates/wasm/**"
      - "mise.toml"
      - ".github/workflows/wasm-release.yml"
      - ".github/workflows/wasm-release-parser.yml"
      - ".github/workflows/upgrade-langs.yml"
  # Plan only, never publish. Everything the plan needs — the toolchain and
  # reaching both registries — otherwise runs for the first time after a merge,
  # where a mistake stops a release rather than a pull request.
  pull_request:
    paths:
      - "wasm-bundles.json"
      - "languages.toml"
      - "crates/dev/**"
      - "crates/lumis/vendored_parsers/**"
      - "queries/**"
      - "packages/javascript/lumis/bundles/**"
      - "packages/javascript/lumis/langs/**"
      - "packages/javascript/lumis/src/generated/**"
      - "packages/javascript/scripts/build-wasm-bundles.ts"
      - "templates/wasm/**"
      - "mise.toml"
      - ".github/workflows/wasm-release.yml"
      - ".github/workflows/wasm-release-parser.yml"
      - ".github/workflows/upgrade-langs.yml"
      - "packages/javascript/lumis/playwright.staged.config.ts"
      - "packages/javascript/lumis/test/browser/staged-packages.spec.ts"
      - "packages/javascript/lumis/test/browser/staged-packages/**"
  workflow_dispatch:
    inputs:
      parser:
        description: "Parser name(s), comma-separated (leave empty for all)"
        required: false
        default: ""

jobs:
  # The same work `plan` does, on a pull request, publishing nothing.
  #
  # `plan` is guarded to `refs/heads/main`, so until now every part of it — the
  # toolchain it needs and reaching npm and Hex — first ran after a merge. Three
  # releases broke that way in a day: a missing `pnpm`, a missing `pnpm install`,
  # and a plan that resolved a version for a package whose trusted publisher
  # named another workflow.
  #
  # This catches the first two. It cannot catch the third: a trusted publisher
  # lives on the npm package record, and nothing short of a real publish — with
  # the credential, from the workflow that claims it — reports that the wrong
  # workflow is named. Run `mise run npm-trust` after moving a package between
  # workflows; `RELEASE.md` says why.
  #
  # No credentials and no `id-token`, so the worst a bad plan does here is fail
  # this job. It reads both registries, which is public.
  #
  # Skipped on the release-prep branches, which is the `pull_request` half of
  # the `chore(release):` guard `plan` carries for `push`. `release-prepare`
  # bumps a crate version, which rewrites `crates/dev/Cargo.lock` and so matches
  # `crates/dev/**`, but merging one publishes nothing — there is no plan to dry
  # run. The filter cannot tell that lockfile edit from a dependency update that
  # does change the planner, so the branch is what distinguishes them.
  plan-dry-run:
    if: >-
      ${{ github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-plan

      # Printed to the summary because the useful review question about a
      # release-affecting change is "what would this publish", and reading it
      # off a log means opening the run.
      - name: Plan the release
        run: |
          set -euo pipefail
          plan=$(cargo run -q --manifest-path crates/dev/Cargo.toml -- wasm-release-plan "")

          {
            echo "### Release plan"
            echo
            echo '```'
            echo "$plan" | jq -r '.parsers[] | "parser  \(.wasm_name) \(.version) npm=\(.npm) hex=\(.hex)"'
            echo '```'
            echo
            printf 'Merging publishes %s parsers.\n' "$(echo "$plan" | jq -r '.parsers | length')"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$plan" | jq .

  # What to publish, and where. The version comes from the definition rather
  # than a counter: a definition already on one registry keeps the version it
  # was published under, so the other receives that same version instead of a
  # fresh one. Only a definition neither registry has seen takes the next patch.
  #
  # `workflow_dispatch` can be started from any ref, so the branch check is not
  # redundant with the `push` trigger: without it a trial run from a feature
  # branch publishes that branch's definitions, and neither registry lets a
  # version be reused afterwards.
  plan:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      parsers: ${{ steps.plan.outputs.parsers }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-plan

      - name: Plan the release
        id: plan
        env:
          PARSER_FILTER: ${{ inputs.parser }}
        run: |
          plan=$(cargo run -q --manifest-path crates/dev/Cargo.toml -- \
            wasm-release-plan "$PARSER_FILTER")
          echo "$plan" | jq -r '.parsers[] | "\(.wasm_name) \(.version) npm=\(.npm) hex=\(.hex)"'

          # One pipeline per parser that any registry is missing, publishing to
          # whichever registries are missing it.
          {
            echo "parsers=$(echo "$plan" | jq -c '[.parsers[] | {parser: .wasm_name, version: .version, npm: .npm, hex: .hex, from_hex: .from_hex, npm_package: .npm_package, app: .hex_package}]')"
            echo "any=$(echo "$plan" | jq -r '.parsers | length > 0')"
          } >> "$GITHUB_OUTPUT"

      # Every parser job runs this same tool, so it is compiled once, here, and
      # handed to them. Stripped, because each of them downloads it.
      - name: Keep the dev tool for the parser jobs
        if: steps.plan.outputs.any == 'true'
        run: strip -o "$RUNNER_TEMP/dev" crates/dev/target/debug/dev

      - uses: actions/upload-artifact@v7.0.2
        if: steps.plan.outputs.any == 'true'
        with:
          name: dev
          path: ${{ runner.temp }}/dev
          retention-days: 1
          if-no-files-found: error

  # The Wasmtime half of `mise run wasm-check`, compiled once and handed to
  # every parser job, as `plan` does with the dev tool. web-tree-sitter alone
  # passed parsers whose queries the Elixir NIF, the native addon and the CLI
  # reject (#1738).
  #
  # Built on a pull request too, and run there against the fixture parsers the
  # way a parser job runs it, outside cargo, so neither first happens after a
  # merge. The test reads the checkout it was compiled in, and every job here
  # checks this repository out at the same path.
  query-check:
    if: >-
      ${{ (github.ref == 'refs/heads/main' &&
           !startsWith(github.event.head_commit.message, 'chore(release):')) ||
          (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: wasm-release-query-check

      # Stripped, because every parser job downloads it.
      - name: Build the check
        run: |
          set -euo pipefail
          bin=$(cargo test -q -p lumis-wasm-runtime --test query_compile --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "query_compile") | .executable // empty')
          [ -n "$bin" ] || { echo "cargo built no query_compile test" >&2; exit 1; }
          strip -o "$RUNNER_TEMP/query_compile" "$bin"

      - name: Check the fixture parsers with it
        run: |
          "$RUNNER_TEMP/query_compile" --exact fixture_parsers_compile_their_queries_in_wasmtime

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: query-check
          path: ${{ runner.temp }}/query_compile
          retention-days: 1
          if-no-files-found: error

  # Stages a few parsers and a bundle from this checkout, installs them as
  # tarballs into a Vite 8 project, and highlights with them in Chromium. A
  # parser package finds its parser relative to its own module, so a template
  # change a bundler cannot follow ships parsers no page can load, and nothing
  # else here loads an installed package through a bundler (#1624).
  bundler-check:
    if: >-
      ${{ (github.ref == 'refs/heads/main' &&
           !startsWith(github.event.head_commit.message, 'chore(release):')) ||
          (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-plan

      - name: Cache the WASI SDK
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/tree-sitter
          key: ${{ runner.os }}-wasi-sdk-${{ hashFiles('crates/dev/src/wasi_sdk.rs') }}

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium and WebKit
        run: pnpm --filter @lumis-sh/lumis exec playwright install --with-deps chromium webkit

      - run: mise run wasm-check-bundler

  # One pipeline per parser, in `wasm-release-parser.yml`: build once, then
  # publish to npm and Hex in parallel. A parser that fails stops its own
  # pipeline and nothing else.
  #
  # `id-token: write` is granted here only so the called workflow can pass it
  # to its npm job; its other jobs drop it.
  #
  # Twenty pipelines at once. A full run is 113 builds of a minute or two each,
  # so this is what bounds how long a release takes; other workflows can queue
  # behind it meanwhile.
  release:
    needs: [plan, query-check, bundler-check]
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.parser }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.parsers) }}
    uses: ./.github/workflows/wasm-release-parser.yml
    with:
      parser: ${{ matrix.parser }}
      version: ${{ matrix.version }}
      npm: ${{ matrix.npm }}
      hex: ${{ matrix.hex }}
      from_hex: ${{ matrix.from_hex }}
      npm_package: ${{ matrix.npm_package }}
      app: ${{ matrix.app }}
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  # A bundle's release pull request fails here until every member it requires
  # is on that bundle's registry. Re-run it once the parsers it waits for are out.
  bundle-check:
    if: >-
      ${{ github.event_name == 'pull_request' &&
          (startsWith(github.head_ref, 'release/npm-wasm-bundle-') ||
           startsWith(github.head_ref, 'release/hex-wasm-bundle-')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-plan

      - name: Check every member is published
        env:
          BRANCH: ${{ github.head_ref }}
        run: cargo run -q --manifest-path crates/dev/Cargo.toml -- wasm-bundle-check "${BRANCH#release/}"

  # Bundles publish only from the tag a merged release pull request gets. This
  # fails while a member is missing on that registry; re-run it once it is out.
  bundle-plan:
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/npm-wasm-bundle-') ||
          startsWith(github.ref, 'refs/tags/hex-wasm-bundle-') }}
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.plan.outputs.bundle }}
      app: ${{ steps.plan.outputs.app }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-plan

      # A registry that already has the version publishes nothing, so a re-run
      # never publishes twice.
      - name: Plan the bundle
        id: plan
        run: |
          set -euo pipefail
          package="${GITHUB_REF_NAME%/v*}"
          version="${GITHUB_REF_NAME##*/v}"
          plan=$(cargo run -q --manifest-path crates/dev/Cargo.toml -- \
            wasm-bundle-publish-plan "$package" "$version")
          echo "$plan"
          {
            echo "bundle=$(jq -r .bundle <<< "$plan")"
            echo "app=$(jq -r .app <<< "$plan")"
            echo "version=$version"
            echo "publish=$(jq -r .publish <<< "$plan")"
          } >> "$GITHUB_OUTPUT"

  publish-npm-bundle:
    needs: bundle-plan
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/npm-wasm-bundle-') &&
          needs.bundle-plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - run: npm install --global npm@12

      - name: Generate the bundle
        run: cargo run -q --manifest-path crates/dev/Cargo.toml -- stage-npm-bundle "$BUNDLE"
        env:
          BUNDLE: ${{ needs.bundle-plan.outputs.bundle }}

      - name: Publish to npm
        run: |
          cd -- "tmp/wasm/npm/wasm-bundle-$BUNDLE"
          npm publish --access public --provenance
        env:
          BUNDLE: ${{ needs.bundle-plan.outputs.bundle }}

  publish-hex-bundle:
    needs: bundle-plan
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/hex-wasm-bundle-') &&
          needs.bundle-plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.2.2
        with:
          install: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      # Staged, Hex installed and dependencies fetched before the key exists:
      # all three run or download code that has no business being able to read
      # it.
      #
      # `deps.get` for a package that ships no code, because `mix hex.publish`
      # refuses to run while any dependency is unchecked out — `mix hex.build`
      # does not, but there is no publish path that takes a prebuilt tarball.
      # Fetching is the whole cost: the bundle's `files` list is `mix.exs`,
      # `README.md` and `LICENSE`, so nothing is compiled and none of what this
      # downloads reaches the tarball.
      - name: Stage the bundle
        run: |
          cargo run -q --manifest-path crates/dev/Cargo.toml -- stage-hex-bundle "$BUNDLE"
          mix local.hex --force
          cd -- "tmp/wasm/hex/$APP"
          mix deps.get
        env:
          BUNDLE: ${{ needs.bundle-plan.outputs.bundle }}
          APP: ${{ needs.bundle-plan.outputs.app }}

      - name: Publish the bundle to Hex
        run: |
          cd -- "tmp/wasm/hex/$APP"
          mix hex.publish package --yes
        env:
          APP: ${{ needs.bundle-plan.outputs.app }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
