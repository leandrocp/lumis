name: Generate CSS

on:
  schedule:
    - cron: "0 22 * * 2"
  workflow_run:
    workflows: [Generate Themes]
    types:
      - completed
  workflow_dispatch:
  push:
    tags-ignore:
      - "**"
    paths:
      - ".github/workflows/gen-css.yml"

jobs:
  gen-css:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: false

      - name: Install Neovim
        run: |
          sudo add-apt-repository ppa:neovim-ppa/unstable -y
          sudo apt-get update
          sudo apt-get install -y lua5.4 neovim

      - name: css-gen
        run: echo "y" | mise run css-gen

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CI_TOKEN }}
          add-paths: |
            css
            crates/lumis/css
            packages/elixir/lumis/priv/static/css
          commit-message: "chore: generate css"
          title: "chore: generate css"
          body: |
            Automated PR to generate css.

            This PR was created automatically by the gen-css workflow.
          branch: gen-css
          delete-branch: true
          base: main
