name: JavaScript CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "packages/javascript/lumis/**"
      - "packages/javascript/markdown-it-lumis/**"
      - "packages/javascript/rehype-lumis/**"
      - "packages/javascript/react/**"
      - "packages/javascript/themes/**"
      - "packages/javascript/package.json"
      - "packages/javascript/scripts/check-native-versions.mjs"
      - "packages/javascript/wasm-bundle-*/**"
      - "crates/lumis-core/**"
      - "crates/lumis/**"
      - "crates/lumis-wasm-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "queries/**"
      - "languages.toml"
      - "mise.toml"
      - ".github/workflows/javascript.yml"
  pull_request:
    paths:
      - "packages/javascript/lumis/**"
      - "packages/javascript/markdown-it-lumis/**"
      - "packages/javascript/rehype-lumis/**"
      - "packages/javascript/react/**"
      - "packages/javascript/themes/**"
      - "packages/javascript/package.json"
      - "packages/javascript/scripts/check-native-versions.mjs"
      - "packages/javascript/wasm-bundle-*/**"
      - "crates/lumis-core/**"
      - "crates/lumis/**"
      - "crates/lumis-wasm-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "queries/**"
      - "languages.toml"
      - "mise.toml"
      - ".github/workflows/javascript.yml"
  workflow_dispatch:

jobs:
  lint:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Formatting and the rules that need no type information are checked over
      # the whole repository by `lint.yml`. These add the type-aware rules, so
      # they build what each package's tsconfig resolves against.
      - run: pnpm --filter @lumis-sh/lumis run lint
      - run: pnpm --filter @lumis-sh/markdown-it-lumis run lint
      - run: pnpm --filter @lumis-sh/rehype-lumis run lint
      - run: pnpm --filter @lumis-sh/react run lint
      - run: pnpm --filter @lumis-sh/themes run lint
      # `mise run docs` is the only caller of this script, and a pnpm upgrade
      # once made it unrunnable without any check going red.
      - run: pnpm --filter @lumis-sh/lumis run build:generate
      - run: pnpm --filter @lumis-sh/lumis run docs
      # The release workflow publishes six native npm packages before the main
      # package, and npm will not republish an existing version.
      - run: node packages/javascript/scripts/check-native-versions.mjs
      - run: pnpm --dir packages/javascript run build:wasm-bundles && git diff --exit-code -- packages/javascript/wasm-bundle-*

  test:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumis-sh/themes run build
      # Node highlights through the addon, so the tests build it and the parser
      # tree it resolves against.
      - run: cargo run -q --manifest-path crates/dev/Cargo.toml -- stage-test-parsers target/test-parsers
      - run: pnpm --filter @lumis-sh/lumis run build:native
      - run: pnpm --filter @lumis-sh/lumis run build
      - run: pnpm --filter @lumis-sh/markdown-it-lumis run build
      - run: pnpm --filter @lumis-sh/rehype-lumis run build
      - run: pnpm --filter @lumis-sh/react run build
      # The addon resolves parsers in Rust, so the downstream packages read the
      # store directly rather than the JavaScript resolvers the Wasm runtime uses.
      - run: pnpm --filter @lumis-sh/markdown-it-lumis run test
        env:
          LUMIS_DATA_DIR: ${{ github.workspace }}/target/test-parsers
      - run: pnpm --filter @lumis-sh/rehype-lumis run test
        env:
          LUMIS_DATA_DIR: ${{ github.workspace }}/target/test-parsers
      # Needs no parser store: it checks that the shim resolves the platform
      # package npm installed, not that the binary highlights anything.
      - run: pnpm --filter @lumis-sh/cli run test
      # Both runtimes, explicitly. vite.config.mjs defaults to Wasm, so leaving
      # this unset would run the same one twice and leave every native-only
      # resolver and lifetime behaviour uncovered.
      - run: |
          native_runtime_data_dir="$(mktemp -d)"
          native_suite_data_dir="$(mktemp -d)"
          trap 'rm -rf "$native_runtime_data_dir" "$native_suite_data_dir"' EXIT
          cp -R "$GITHUB_WORKSPACE/target/test-parsers/parsers" "$native_runtime_data_dir/"
          LUMIS_TEST_RUNTIME=native \
            LUMIS_DATA_DIR="$native_runtime_data_dir" \
            pnpm --filter @lumis-sh/lumis exec vitest run test/native-runtime.test.ts
          LUMIS_TEST_RUNTIME=native \
            LUMIS_DATA_DIR="$native_suite_data_dir" \
            pnpm --filter @lumis-sh/lumis exec vitest run \
              --exclude test/conformance.test.ts \
              --exclude test/query-compile.test.ts \
              --exclude 'test/browser/**' \
              --exclude test/native-runtime.test.ts
      - run: |
          wasm_suite_data_dir="$(mktemp -d)"
          trap 'rm -rf "$wasm_suite_data_dir"' EXIT
          cp -R "$GITHUB_WORKSPACE/target/test-parsers/parsers" "$wasm_suite_data_dir/"
          LUMIS_TEST_RUNTIME=wasm \
            LUMIS_DATA_DIR="$wasm_suite_data_dir" \
            pnpm --filter @lumis-sh/lumis run test
      - run: pnpm --filter @lumis-sh/react run test
        env:
          LUMIS_DATA_DIR: ${{ github.workspace }}/target/test-parsers
