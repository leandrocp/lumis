name: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "**/*.cjs"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.lua"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.tsx"
      - ".github/actionlint.yaml"
      - ".github/tests/**"
      - ".github/workflows/**"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "Cargo.toml"
      - "THEMES.md"
      - "benchmarks/rust/**"
      - "crates/autumnus/**"
      - "crates/dev/**"
      - "crates/lumis-build/**"
      - "crates/lumis-core/themes/NOTICE.md"
      - "crates/lumis-wasm-runtime/src/catalog.rs"
      - "docs/content/reference/themes.md"
      - "languages.toml"
      - "mise.toml"
      - "neovim.yml"
      - "pnpm-lock.yaml"
      - "selene.toml"
      - "themes/**"
  pull_request:
    paths:
      - "**/*.cjs"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.lua"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.tsx"
      - ".github/actionlint.yaml"
      - ".github/tests/**"
      - ".github/workflows/**"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "Cargo.toml"
      - "THEMES.md"
      - "benchmarks/rust/**"
      - "crates/autumnus/**"
      - "crates/dev/**"
      - "crates/lumis-build/**"
      - "crates/lumis-core/themes/NOTICE.md"
      - "crates/lumis-wasm-runtime/src/catalog.rs"
      - "docs/content/reference/themes.md"
      - "languages.toml"
      - "mise.toml"
      - "neovim.yml"
      - "pnpm-lock.yaml"
      - "selene.toml"
      - "themes/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-overrides:
    name: Release bump overrides
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - run: mise run test-release-overrides

  actionlint:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  actions-lock:
    name: Workflow dependency lockfile
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.2.0
      - run: gh actions-lock --verify

  lua:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.2
      - run: mise run fmt-lua -- --check
      - run: mise run lint-lua

  # Every file the repo authors, including the website, the docs site, the
  # benchmark scripts and every example. The per-package `lint` scripts in
  # `javascript.yml` add the type-aware rules on top, and only reach what their
  # own tsconfig covers.
  javascript:
    name: JavaScript and TypeScript
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.2
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: mise run fmt-js -- --check
      - run: mise run lint-js

  rust-outside-workspace:
    name: Rust crates outside the workspace
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            benchmarks/rust -> target
            crates/autumnus -> target
            crates/dev -> target
          shared-key: outside-workspace
      - run: cargo fmt --manifest-path benchmarks/rust/Cargo.toml --check
      - run: cargo fmt --manifest-path crates/autumnus/Cargo.toml --check
      - run: cargo fmt --manifest-path crates/dev/Cargo.toml --check
      - run: cargo test --manifest-path crates/dev/Cargo.toml --no-default-features
      - run: cargo run --manifest-path crates/dev/Cargo.toml --no-default-features -- gen-themes-md --check
      # Each of these is its own workspace, so it carries its own `[lints]`
      # table; Cargo cannot inherit one across workspaces. Nothing else compiles
      # them, so without these steps nothing reports on them at all.
      - run: cargo clippy --manifest-path benchmarks/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path crates/autumnus/Cargo.toml --all-targets -- -D warnings
      - run: >-
          cargo clippy --manifest-path crates/dev/Cargo.toml
          --all-targets --no-default-features -- -D warnings
