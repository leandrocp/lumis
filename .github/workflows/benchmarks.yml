name: Benchmarks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Timings are not a merge gate, and the published ones are refreshed by hand when
# they need to be, so the suite runs only from the Run workflow button. To publish
# the comparison's times, unpack the run's `lumis-benchmarks-*` artifact into
# target/benchmarks/runs/current and run
# `mise run -C benchmarks comparison-timings-publish`.
on:
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmark / ${{ matrix.label }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Rust and syntect
            task: rust
            size_task: package-size:rust
          - label: JavaScript and Shiki
            task: javascript
            size_task: package-size:javascript
          - label: Elixir
            task: elixir
            size_task: package-size:elixir
          - label: CLI and bat
            task: cli
            size_task: package-size:cli
          # Every library on every document of the visual comparison, on one
          # runner, so the times beside the outputs are comparable to each other.
          - label: Visual comparison
            task: comparison-timings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # Pinned: mise 2026.7.18 cannot install core:erlang/core:elixir on the
          # runner, and benchmarks/mise.lock was produced by this version.
          version: 2026.7.3
          working_directory: benchmarks
          install_args: --locked
          cache: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            .
            benchmarks/rust
      - name: Run benchmark suite
        env:
          BENCH_RUNS: 3
          BENCH_SAMPLES: 3
          BENCH_WARMUP: 1
          BENCH_WARMUP_SECONDS: 0.1
        run: mise run -C benchmarks ${{ matrix.task }}
      - name: Measure JavaScript package sizes
        if: matrix.task == 'javascript'
        run: |
          node_root="$(mise where node@24.18.0)"
          pnpm_root="$(mise where pnpm@11.15.1)"
          npm_modules="$node_root/lib/node_modules/npm/node_modules"
          BENCH_NPM_TAR="$npm_modules/tar" BENCH_PNPM="$pnpm_root/pnpm" \
            BENCH_PACKAGE_SIZE_GROUP=javascript \
            "$node_root/bin/node" benchmarks/scripts/measure-package-sizes.mjs
      - name: Measure native package sizes
        if: matrix.size_task && matrix.task != 'javascript'
        run: mise run -C benchmarks ${{ matrix.size_task }}
      - name: Upload partial benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lumis-benchmark-part-${{ matrix.task }}-${{ github.sha }}
          path: target/benchmarks/runs/current
          if-no-files-found: error
          retention-days: 1

  report:
    name: Benchmark suite
    needs: benchmark
    if: always()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
      - name: Download partial benchmark reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: lumis-benchmark-part-*-${{ github.sha }}
          path: target/benchmarks/runs/current
          merge-multiple: true
      - name: Merge and validate benchmark reports
        run: |
          node benchmarks/scripts/verify-fixtures.mjs
          node benchmarks/scripts/merge-package-sizes.mjs
          node benchmarks/scripts/merge-results.mjs
      - name: Publish benchmark values
        if: always()
        run: |
          summary=target/benchmarks/runs/current/results.md
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lumis-benchmarks-${{ github.sha }}
          path: target/benchmarks/runs/current
          if-no-files-found: warn
          retention-days: 7
