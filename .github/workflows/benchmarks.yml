name: Benchmarks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Timings are a trend to watch, not a merge gate: nothing reads a single
# commit's numbers, so the suite runs weekly instead of on every push. Reach
# for the Run workflow button when a change is worth measuring on its own.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmarks.yml"

jobs:
  benchmark:
    name: Benchmark / ${{ matrix.label }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Rust and syntect
            task: rust
            size_task: package-size:rust
          - label: JavaScript and Shiki
            task: javascript
            size_task: package-size:javascript
          - label: Elixir
            task: elixir
            size_task: package-size:elixir
          - label: CLI and bat
            task: cli
            size_task: package-size:cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Pinned: mise 2026.7.18 cannot install core:erlang/core:elixir on the
          # runner, and benchmarks/mise.lock was produced by this version.
          version: 2026.7.3
          working_directory: benchmarks
          install_args: --locked
          cache: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            .
            benchmarks/rust
      - name: Run benchmark suite
        env:
          BENCH_RUNS: 3
          BENCH_SAMPLES: 3
          BENCH_WARMUP: 1
          BENCH_WARMUP_SECONDS: 0.1
        run: mise run -C benchmarks ${{ matrix.task }}
      - name: Measure JavaScript package sizes
        if: matrix.task == 'javascript'
        run: |
          node_root="$(mise where node@24.18.0)"
          pnpm_root="$(mise where pnpm@11.15.1)"
          npm_modules="$node_root/lib/node_modules/npm/node_modules"
          BENCH_NPM_TAR="$npm_modules/tar" BENCH_PNPM="$pnpm_root/pnpm" \
            BENCH_PACKAGE_SIZE_GROUP=javascript \
            "$node_root/bin/node" benchmarks/scripts/measure-package-sizes.mjs
      - name: Measure native package sizes
        if: matrix.task != 'javascript'
        run: mise run -C benchmarks ${{ matrix.size_task }}
      - name: Upload partial benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lumis-benchmark-part-${{ matrix.task }}-${{ github.sha }}
          path: target/benchmarks/runs/current
          if-no-files-found: error
          retention-days: 1

  report:
    name: Benchmark suite
    needs: benchmark
    if: always()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - name: Download partial benchmark reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: lumis-benchmark-part-*-${{ github.sha }}
          path: target/benchmarks/runs/current
          merge-multiple: true
      - name: Merge and validate benchmark reports
        run: |
          node benchmarks/scripts/verify-fixtures.mjs
          node benchmarks/scripts/merge-package-sizes.mjs
          node benchmarks/scripts/merge-results.mjs
      - name: Publish benchmark values
        if: always()
        run: |
          summary=target/benchmarks/runs/current/results.md
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lumis-benchmarks-${{ github.sha }}
          path: target/benchmarks/runs/current
          if-no-files-found: warn
          retention-days: 7
