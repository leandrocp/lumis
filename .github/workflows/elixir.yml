name: Elixir CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "fixtures/api.json"
      - "fixtures/language-lookup.json"
      - "packages/elixir/lumis/**"
      - "packages/elixir/themes/**"
      - "packages/elixir/themes-copyleft/**"
      - "packages/javascript/lumis/bundles/**"
      - "crates/lumis-wasm-runtime/**"
      - ".github/workflows/elixir.yml"
  pull_request:
    paths:
      - "fixtures/api.json"
      - "fixtures/language-lookup.json"
      - "packages/elixir/lumis/**"
      - "packages/elixir/themes/**"
      - "packages/elixir/themes-copyleft/**"
      - "packages/javascript/lumis/bundles/**"
      - "crates/lumis-wasm-runtime/**"
      - ".github/workflows/elixir.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/elixir/lumis

jobs:
  test:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    uses: leandrocp/github-actions/.github/workflows/elixir-test.yml@main
    with:
      working-directory: packages/elixir/lumis
      env_vars: '{"LUMIS_BUILD": "1"}'
      rust-toolchain: 'stable'
      # Newest pair on a pull request; every supported pair on main, where an
      # OTP or Elixir incompatibility has to surface before a release. Spelled
      # out on both sides because an empty string is not the same as omitting
      # the input: it would produce an empty matrix and run nothing.
      pairs: "${{ github.event_name == 'pull_request' && '[{\"name\": \"OTP 29.x, Elixir 1.20.x\", \"elixir\": \"1.20.x\", \"otp\": \"29.x\"}]' || '[{\"name\": \"OTP 25.1, Elixir 1.15.0\", \"elixir\": \"1.15.0\", \"otp\": \"25.1\"}, {\"name\": \"OTP 29.x, Elixir 1.20.x\", \"elixir\": \"1.20.x\", \"otp\": \"29.x\"}, {\"name\": \"OTP 29, Elixir main\", \"elixir\": \"main-otp-29\", \"otp\": \"maint-29\"}]' }}"
  lint:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/')) }}
    uses: leandrocp/github-actions/.github/workflows/elixir-lint.yml@main
    with:
      working-directory: packages/elixir/lumis
      env_vars: '{"LUMIS_BUILD": "1"}'
      rust-toolchain: 'stable'
      credo: true
      credo_args: '--strict'
      pairs: "${{ github.event_name == 'pull_request' && '[{\"name\": \"OTP 29.x, Elixir 1.20.x\", \"elixir\": \"1.20.x\", \"otp\": \"29.x\"}]' || '[{\"name\": \"OTP 29.x, Elixir 1.20.x\", \"elixir\": \"1.20.x\", \"otp\": \"29.x\"}, {\"name\": \"OTP 29, Elixir main\", \"elixir\": \"main-otp-29\", \"otp\": \"maint-29\"}]' }}"
