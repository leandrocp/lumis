name: Elixir Release

on:
  push:
    tags:
      - "hex-lumis/v*"
      - "hex-themes/v*"
      - "hex-themes-copyleft/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: hex-lumis/v0.3.0)"
        required: false
        type: string

env:
  LUMIS_BUILD: "1"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  nif-lock:
    name: Verify packaged NIF lockfile
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      startsWith(inputs.tag || github.ref_name, 'hex-lumis/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: false

      # A pull request that needs unpublished lumis crates patches them into the
      # NIF's own manifest so its standalone build resolves. A published package
      # cannot depend on that, so the patch has to go before a release.
      - name: Refuse a patched NIF manifest
        run: |
          has_patch=$(yq -p=toml -o=yaml 'has("patch")' packages/elixir/lumis/native/lumis_nif/Cargo.toml)
          if [ "$has_patch" = true ]; then
            echo "packages/elixir/lumis/native/lumis_nif/Cargo.toml still has a [patch] table." >&2
            echo "Publish the crates it patches, remove it, then run mise run elixir-nif-lock-check --fix." >&2
            exit 1
          fi

      - run: mise run elixir-nif-lock-check

  nif-release:
    needs: nif-lock
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      startsWith(inputs.tag || github.ref_name, 'hex-lumis/v')
    uses: leandrocp/github-actions/.github/workflows/nif-release.yml@84f29a1e6b71de81fe806e553eb72b5e8aebe729
    with:
      locked: true
      project-name: lumis_nif
      project-dir: packages/elixir/lumis/native/lumis_nif
      working-directory: packages/elixir/lumis
      r2-path: releases/download/${{ inputs.tag || github.ref_name }}
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  hex-publish:
    name: Publish to Hex
    needs: nif-release
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      startsWith(inputs.tag || github.ref_name, 'hex-lumis/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/elixir/lumis

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Fetch dependencies
        run: mix deps.get

      - name: Generate checksums
        run: mix rustler_precompiled.download Lumis.Native --all --print

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  themes-publish:
    name: Publish theme assets to Hex
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      (startsWith(inputs.tag || github.ref_name, 'hex-themes/v') ||
       startsWith(inputs.tag || github.ref_name, 'hex-themes-copyleft/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Determine theme package
        id: pkg
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          component="${RELEASE_TAG%%/v*}"
          case "$component" in
            hex-themes | hex-themes-copyleft)
              echo "directory=packages/elixir/${component#hex-}" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac

      - name: Install Hex
        run: mix local.hex --force

      - name: Publish theme package
        working-directory: ${{ steps.pkg.outputs.directory }}
        run: mix hex.publish package --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
