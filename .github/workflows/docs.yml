name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Without `package_json_file` the action checks `version` against the root
      # `package.json`, whose `packageManager` is the workspace's pnpm 11, and
      # fails on the mismatch. The site pins its own.
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm build
        working-directory: docs
      - run: pnpm check:markdown
        working-directory: docs
