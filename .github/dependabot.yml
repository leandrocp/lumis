version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "tree-sitter-*"
      - dependency-name: "tree-sitter"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "wasmtime"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "mix"
    directory: "/packages/elixir/lumis"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "tree-sitter-*"

  - package-ecosystem: "cargo"
    directory: "/packages/elixir/lumis/native/lumis_nif"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "tree-sitter-*"
      - dependency-name: "tree-sitter"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "wasmtime"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/packages/javascript"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "tree-sitter-*"
      - dependency-name: "web-tree-sitter"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "@lumis-sh/wasm-*"
