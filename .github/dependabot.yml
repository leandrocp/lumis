version: 2

# Dependabot is the only thing that proposes updates to these lockfiles, so a
# directory absent from this file is a dependency set that silently ages. Every
# committed lockfile in the repository appears below, bar the deliberate
# omissions noted at the bottom.

updates:
  # One entry across every Cargo.lock rather than one entry per workspace, so a
  # bump lands as a single pull request touching all of them. Two tests assert
  # these lockfiles agree: `lockfile_parity` that they resolve the same
  # tree-sitter, and `elixir-nif-lock-check` that the workspace and the packaged
  # NIF hold the same wasmtime, because compiled parser caches are keyed by the
  # wasmtime version. An update that reaches one lockfile and not another is a
  # red build, not a partial improvement.
  #
  # `crates/dev` and `benchmarks/rust` declare their own `[workspace]` and were
  # missing here, so nothing updated them: `benchmarks/rust` had never received
  # a single Dependabot commit. They drifted to tree-sitter 0.26.11 while the
  # library shipped 0.26.13, and `crates/dev` generates `fixtures/conformance`
  # and runs `stress-test/`, so it was measuring the corpus against a parser the
  # library does not use — 15x apart on one stress case (#1447).
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/crates/dev"
      - "/benchmarks/rust"
      - "/packages/elixir/lumis/native/lumis_nif"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # Grammar crates move through `mise run upgrade-langs`, which regenerates
      # the queries and fixtures that go with them.
      - dependency-name: "tree-sitter-*"
      # tree-sitter and wasmtime move together and set the MSRV between them:
      # tree-sitter's `wasm` feature pins `wasmtime-c-api-impl`, and 0.27 pins
      # the 48 series, which requires rustc 1.95. Picking that up is a release
      # decision rather than a weekly one.
      - dependency-name: "tree-sitter"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "wasmtime"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"

  # `benchmarks/elixir` is here for the same reason as `benchmarks/rust`: it is
  # run from CI, so its dependencies are real.
  - package-ecosystem: "mix"
    directories:
      - "/packages/elixir/lumis"
      - "/benchmarks/elixir"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"

  # Every member of the pnpm workspace, not just its root. `packages/javascript`
  # holds four devDependencies and the tooling scripts; the 118 dependencies
  # that ship live in the members below, and this entry named only the root, so
  # Dependabot had never seen one of them. `web-tree-sitter` sat pinned two
  # patches behind in `lumis/package.json` the whole time, with patch updates
  # allowed.
  #
  # One entry rather than one per member because they share a single
  # `pnpm-lock.yaml` at the repository root. Separate entries would each rewrite
  # that one file and conflict with each other.
  #
  # Not `/`, which is where that lockfile and `pnpm-workspace.yaml` live: there
  # is no `package.json` there, so Dependabot would find no manifest to read.
  # It resolves the root lockfile from a member instead.
  #
  # Listed one by one rather than globbed with `packages/javascript/*`, which
  # also matches `scripts/`, a directory with no `package.json`. A configuration
  # Dependabot rejects produces no updates and says so nowhere this repository
  # looks, which is the failure this entry is fixing — so adding a package here
  # is worth the manual step. `pnpm-workspace.yaml` lists the same set.
  - package-ecosystem: "npm"
    directories:
      - "/packages/javascript"
      - "/packages/javascript/cli"
      - "/packages/javascript/lumis"
      - "/packages/javascript/markdown-it-lumis"
      - "/packages/javascript/react"
      - "/packages/javascript/rehype-lumis"
      - "/packages/javascript/themes"
      - "/packages/javascript/vite"
      - "/benchmarks/javascript"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "tree-sitter-*"
      # web-tree-sitter has to match the tree-sitter the Rust side links, or the
      # two runtimes disagree about what they can parse.
      - dependency-name: "web-tree-sitter"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Published from this repository. A bump here would be proposing a version
      # of ourselves.
      - dependency-name: "@lumis-sh/wasm-*"

  # Both deployed sites, in one entry so a bump produces one commit and so one
  # pair of Vercel previews rather than two.
  - package-ecosystem: "npm"
    directories:
      - "/docs"
      - "/website"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # Published from this repository, and the sites exist to show a released
      # Lumis. They move when a release moves them, not weekly.
      - dependency-name: "@lumis-sh/*"

# Deliberately absent:
#
# - The example apps under `packages/*/*/examples/`. They are illustrations to
#   be copied, pinned to the versions their prose describes, and nothing builds
#   them, so a bump there is churn without a signal. The lists above stop
#   one directory short of them.
# - The generated per-platform stubs under `*/npm/<target>/`, which the pnpm
#   workspace includes but release tooling writes. They carry no dependencies.
# - `crates/autumnus`, a deprecated shim that commits no lockfile.
#
# One thing to watch: `packages/javascript/lumis` carries its own
# `pnpm-lock.yaml` alongside the root one, and it is where `web-tree-sitter` is
# pinned. Now that the globs reach that directory, check the first pull request
# touching it updates whichever of the two lockfiles the build actually reads.
