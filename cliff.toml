[changelog]
header = ""
body = ""
footer = ""
trim = true
format = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
sort_commits = "oldest"
commit_preprocessors = [
  # Correct the breaking-change marker omitted from the squash of #1559.
  { pattern = '^fix: (render HTML lines as inline spans with overridable layout CSS) \(#1559\)', replace = 'fix!: ${1} (#1559)' },
  { pattern = '\\((\\w+\\s)?#([0-9]+)\\)', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Code Refactoring" },
  { message = "^revert", group = "Reverts" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = '^chore\(javascript\): update npm CLI binary to [0-9]+\.[0-9]+\.[0-9]+(\s|$)', group = "Dependencies" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = false
breaking_always_bump_major = false
