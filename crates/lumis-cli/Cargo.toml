[package]
name = "lumis-cli"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Syntax Highlighter CLI powered by Tree-sitter and Neovim themes"
keywords = ["lumis", "syntax-highlighter", "tree-sitter", "neovim", "cli"]
categories = ["command-line-utilities", "text-processing"]
include = [
  "/src/",
  "/themes/",
  "/build.rs",
  "/formatter-options.json",
  "/CHANGELOG.md",
  "/LICENSE",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/cargo-lumis-cli/v{ version }/lumis-{ target }{ archive-suffix }"
bin-dir = "lumis{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"

[[bin]]
name = "lumis"
path = "src/main.rs"
doc = false

[dependencies]
lumis-core = { path = "../lumis-core", version = "4.0.2", features = ["all-languages"] }
lumis-wasm-runtime = { path = "../lumis-wasm-runtime", version = "0.5.0" }
tree-sitter = { version = "^0.27.1", features = ["wasm"] }
wasmtime = { version = "48", default-features = false, features = ["cache", "cranelift", "runtime", "std"] }
streaming-iterator = "0.1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
etcetera = "0.11"
tempfile = "3"
terminal_size = "0.4"
terminal-trx = "0.2.6"
vte = { version = "0.15", default-features = false }
xterm-color = "1.0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
