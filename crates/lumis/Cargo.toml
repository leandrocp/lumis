[package]
name = "lumis"
version = "0.13.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

description = "Syntax Highlighter powered by Tree-sitter and Neovim themes"
keywords = ["lumis", "syntax-highlighter", "tree-sitter", "neovim"]
categories = ["text-processing"]
include = [
    "/build.rs",
    "/languages.toml",
    "/src/",
    "/vendored_parsers/tree-sitter-*/**/*.h",
    "/vendored_parsers/tree-sitter-*/**/*.c",
    "/vendored_parsers/tree-sitter-*/**/*.cc",
    "/vendored_parsers/tree-sitter-*/**/*.xz",
    "/queries/override/**/highlights.scm",
    "/queries/override/**/injections.scm",
    "/queries/override/**/locals.scm",
    "/queries/append/**/highlights.scm",
    "/queries/append/**/injections.scm",
    "/queries/append/**/locals.scm",
    "/queries/processed/**/highlights.scm",
    "/queries/processed/**/injections.scm",
    "/queries/processed/**/locals.scm",
    "/css/*.css",
    "/themes/*.json",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
no-default-features = true

[features]
dev = []
default = ["all-languages"]

all-languages = [
    "lang-arduino",
    "lang-angular",
    "lang-asm",
    "lang-astro",
