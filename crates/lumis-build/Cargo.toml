[package]
name = "lumis-build"
version = "1.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lumis build utilities"
keywords = ["tree-sitter", "lua", "regex", "build"]
categories = ["development-tools::build-utils"]
include = ["/src/", "/CHANGELOG.md", "/README.md", "/LICENSE"]

[features]
# Identify a license from its text. Adds the SPDX License List to the build.
license = ["dep:spdx", "dep:serde", "dep:serde_json", "dep:url"]

[dependencies]
regex-syntax = "0.8.11"
serde = { version = "1", optional = true }
serde_json = { version = "1", features = ["raw_value"], optional = true }
spdx = { version = "0.13.6", features = ["detection-inline-cache"], optional = true }
tree-sitter = "^0.27.1"
tree-sitter-tsquery = "0.8.0"
url = { version = "2", optional = true }

[dev-dependencies]
regex = "1"
tree-sitter-comment = "0.3.0"
spdx = { version = "0.13.6", features = ["text"] }

[lints]
workspace = true
