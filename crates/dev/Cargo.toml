[package]
name = "dev"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "MIT"
homepage = "https://lumis.sh"
repository = "https://github.com/leandrocp/lumis"
authors = ["Leandro Pereira <leandro@leandro.io>"]

[workspace]

[[bin]]
name = "dev"
path = "src/main.rs"

[features]
default = []
lumis-all-languages = ["lumis/all-languages"]
lumis-stress-languages = [
    "lumis/lang-cpp",
    "lumis/lang-css",
    "lumis/lang-csv",
    "lumis/lang-elixir",
    "lumis/lang-erlang",
    "lumis/lang-gleam",
    "lumis/lang-javascript",
    "lumis/lang-json",
]

[dependencies]
lumis = { path = "../lumis", default-features = false }
lumis-build = { path = "../lumis-build", features = ["license"] }
lumis-wasm-runtime = { path = "../lumis-wasm-runtime", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
full_moon = "3"
flate2 = "1"
glob = "0.3"
lenient_semver = "0.4"
md-5 = "0.11"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
toml = "1.1"
toml_edit = "0.25"
tree-sitter = "0.27.1"
tree-sitter-tsquery = "0.8.0"
ureq = "3"
xz2 = "0.1"

# License detection compares every theme's license files with the whole SPDX
# License List, which takes minutes unoptimized and seconds optimized.
[profile.dev.package.spdx]
opt-level = 3

[profile.dev.package.lumis-build]
opt-level = 3

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# This crate is its own workspace, so it cannot inherit the root's lint table.
# Keep the two in step; the reasoning behind each waiver lives in the root
# `Cargo.toml`.
implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
