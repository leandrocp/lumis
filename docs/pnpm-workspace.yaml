allowBuilds:
  core-js: true
  core-js-pure: true
  esbuild: true
minimumReleaseAgeExclude:
  - "@lumis-sh/*"
# pnpm 12 otherwise prepends a second YAML document that Vercel cannot parse.
pmOnFail: ignore
packageExtensions:
  next@16.3.4:
    dependencies:
      vary: ^1.1.2
patchedDependencies:
  next@16.3.4: patches/next@16.3.4.patch
