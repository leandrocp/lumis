<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumis visual output comparison</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #232634;
        color: #c6d0f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto auto auto auto minmax(0, 1fr);
        overflow: hidden;
      }
      header {
        padding: 28px clamp(18px, 4vw, 56px) 22px;
        border-bottom: 1px solid #414559;
        background: #292c3c;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(24px, 4vw, 38px);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: #a5adce;
      }
      a {
        color: #ca9ee6;
      }
      code {
        color: #99d1db;
      }
      nav {
        display: flex;
        gap: 8px;
        padding: 14px clamp(18px, 4vw, 56px);
        overflow-x: auto;
        border-bottom: 1px solid #414559;
      }
      button {
        flex: 0 0 auto;
        padding: 9px 13px;
        border: 1px solid #51576d;
        border-radius: 999px;
        background: #303446;
        color: #c6d0f5;
        font: inherit;
        cursor: pointer;
      }
      button:hover,
      button[aria-selected="true"] {
        border-color: #ca9ee6;
        background: #414559;
      }
      main {
        min-height: 0;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #292c3c;
      }
      .notice {
        margin-top: 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Visual output comparison</h1>
      <p id="fixture"></p>
      <p class="notice">
        Generate once with <code>mise run -C benchmarks showcase</code>, then open this file
        directly.
      </p>
    </header>
    <nav id="documents" aria-label="Document"></nav>
    <nav id="implementations" aria-label="Implementation"></nav>
    <nav id="themes" aria-label="Theme"></nav>
    <main>
      <iframe title="Highlighted output" loading="eager"></iframe>
    </main>
    <script src="showcase/generated/manifest.js"></script>
    <script>
      const { documents, implementations, themes } = globalThis.LUMIS_BENCHMARK_SHOWCASE;
      const summary = document.querySelector("#fixture");
      const documentNav = document.querySelector("#documents");
      const implementationNav = document.querySelector("#implementations");
      const themeNav = document.querySelector("#themes");
      const frame = document.querySelector("iframe");

      // Switching either tab reloads the frame, so the frame reports where it is
      // and the next page is asked to resume there. Reading the position back off
      // the frame is not an option: opened over file://, each page is its own
      // opaque origin. Positions are kept per document, because the same offset
      // in a different file is not the same place, while the same offset in a
      // different implementation of one file is.
      const positions = new Map();
      let current = { document: documents[0], implementation: implementations[0], theme: themes[0] };
      addEventListener("message", (event) => {
        const scroll = event.data?.lumisShowcaseScroll;
        if (typeof scroll === "number") positions.set(current.document.id, scroll);
      });

      function describe(chosen) {
        const injections = chosen.injections.length ? ` + ${chosen.injections.join(" + ")}` : "";
        summary.replaceChildren(
          `${current.theme.name} · ${chosen.languageLabel}${injections} · ` +
            `${chosen.lines.toLocaleString()} lines · `,
        );
        const link = document.createElement("a");
        link.href = chosen.source;
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = "Original source";
        summary.append(link, ".");
      }

      function show() {
        frame.src =
          `showcase/generated/${current.document.id}/${current.theme.id}/` +
          `${current.implementation.id}.html#at=${positions.get(current.document.id) ?? 0}`;
        frame.title = `${current.implementation.label} highlighting ${current.document.label}`;
        describe(current.document);
      }

      function select(nav, entries, key) {
        for (const entry of entries) {
          const button = document.createElement("button");
          button.textContent = entry.label ?? entry.name;
          button.setAttribute("aria-selected", String(entry === current[key]));
          button.addEventListener("click", () => {
            for (const candidate of nav.children) {
              candidate.setAttribute("aria-selected", String(candidate === button));
            }
            current[key] = entry;
            show();
          });
          nav.append(button);
        }
      }

      select(documentNav, documents, "document");
      select(implementationNav, implementations, "implementation");
      select(themeNav, themes, "theme");
      show();
    </script>
  </body>
</html>
