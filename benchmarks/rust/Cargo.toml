[workspace]

[package]
name = "lumis-benchmarks"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
lumis = { path = "../../crates/lumis", default-features = false, features = ["lang-bash", "lang-c", "lang-comment", "lang-elixir", "lang-heex", "lang-markdown", "lang-markdown-inline", "lang-css", "lang-go", "lang-html", "lang-java", "lang-javascript", "lang-json", "lang-python", "lang-ruby", "lang-rust", "lang-tsx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5.3"
two-face = "0.5.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "scenarios"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bin]]
name = "lumis-size"
path = "src/bin/lumis-size.rs"

[[bin]]
name = "syntect-size"
path = "src/bin/syntect-size.rs"

[[bin]]
name = "showcase"
path = "src/bin/showcase.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
lto = true
codegen-units = 1

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# This crate is its own workspace, so it cannot inherit the root's lint table.
# Keep the two in step; the reasoning behind each waiver lives in the root
# `Cargo.toml`.
implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
