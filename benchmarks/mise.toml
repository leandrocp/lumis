min_version = "2026.7.3"

[tools]
node = "24.18.0"
pnpm = "11.15.1"
rust = { version = "1.91.1", components = ["rustfmt", "clippy"] }
erlang = "28.5"
elixir = "1.19.5-otp-28"
hyperfine = "1.20.0"
bat = "0.26.1"

[env]
BENCH_RUN_DIR = "{{ config_root }}/../target/benchmarks/runs/current"
CARGO_TARGET_DIR = "{{ config_root }}/../target/benchmarks/rust-target"
MIX_INSTALL_DIR = "{{ config_root }}/../target/benchmarks/elixir-install"

[task_config]
dir = "{{ config_root }}/.."

[tasks.install]
description = "Install locked benchmark dependencies"
env = { CI = "true" }
run = "pnpm install --frozen-lockfile"
sources = ["pnpm-lock.yaml", "pnpm-workspace.yaml", "benchmarks/javascript/package.json"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.fixtures]
description = "Generate and verify the four benchmark scenarios"
run = "node benchmarks/scripts/verify-fixtures.mjs"
sources = [
  "benchmarks/fixtures/**/*",
  "benchmarks/scripts/generate-fixtures.mjs",
  "benchmarks/scripts/verify-fixtures.mjs",
]
outputs = ["target/benchmarks/fixtures/scenarios.json"]

[tasks."prepare:languages"]
description = "Build local self-contained language packages for every benchmark runtime"
depends = ["install"]
run = "node benchmarks/scripts/prepare-language-packages.mjs"
sources = [
  "benchmarks/javascript/package.json",
  "benchmarks/scripts/prepare-language-packages.mjs",
  "pnpm-lock.yaml",
  "queries/processed/**/*.scm",
]
outputs = ["target/benchmarks/language-packages/index.json"]

[tasks."build:themes"]
description = "Build the theme consumed by JavaScript benchmarks"
depends = ["install"]
run = "pnpm --filter @lumis-sh/themes run build"
sources = [
  "packages/javascript/themes/package.json",
  "packages/javascript/themes/src/**/*",
  "packages/javascript/themes/scripts/**/*",
  "packages/javascript/themes/themes/**/*",
  "themes/*.json",
]
outputs = ["packages/javascript/themes/dist/index.js"]

[tasks."build:javascript"]
description = "Build the JavaScript runtimes, native addon and Wasm"
depends = ["install", "build:themes", "fixtures"]
run = '''
pnpm --filter @lumis-sh/lumis run build:native
pnpm --filter @lumis-sh/lumis run build
'''
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "languages.toml",
  "packages/javascript/lumis/package.json",
  "packages/javascript/lumis/src/**/*",
  "packages/javascript/lumis/scripts/**/*",
  "crates/lumis/src/**/*.rs",
  "crates/lumis/Cargo.toml",
  "crates/lumis/build.rs",
  "crates/lumis-core/src/**/*.rs",
  "crates/lumis-core/Cargo.toml",
  "crates/lumis-wasm-runtime/src/**/*.rs",
  "crates/lumis-wasm-runtime/Cargo.toml",
  "packages/javascript/lumis/langs/*.ts",
  "queries/processed/**/*.scm",
]
outputs = ["packages/javascript/lumis/dist/index.js"]

[tasks."build:rust"]
description = "Build the Criterion scenario benchmark"
depends = ["fixtures"]
run = "cargo bench --manifest-path benchmarks/rust/Cargo.toml --bench scenarios --no-run"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "benchmarks/rust/Cargo.toml",
  "benchmarks/rust/Cargo.lock",
  "benchmarks/rust/benches/scenarios.rs",
  "crates/lumis/src/**/*.rs",
  "crates/lumis/Cargo.toml",
  "crates/lumis/build.rs",
  "crates/lumis-build/src/**/*.rs",
  "crates/lumis-build/Cargo.toml",
  "crates/lumis-core/src/**/*.rs",
  "crates/lumis-core/Cargo.toml",
  "crates/lumis-wasm-runtime/src/**/*.rs",
  "crates/lumis-wasm-runtime/Cargo.toml",
  "languages.toml",
  "queries/processed/**/*.scm",
]

[tasks."build:rust-sizes"]
description = "Build the stripped Rust package-size executables"
run = "cargo build --manifest-path benchmarks/rust/Cargo.toml --release --bins"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "benchmarks/rust/Cargo.toml",
  "benchmarks/rust/Cargo.lock",
  "benchmarks/rust/src/bin/*.rs",
  "crates/lumis/src/**/*.rs",
  "crates/lumis/Cargo.toml",
  "crates/lumis/build.rs",
  "crates/lumis-build/src/**/*.rs",
  "crates/lumis-build/Cargo.toml",
  "crates/lumis-core/src/**/*.rs",
  "crates/lumis-core/Cargo.toml",
  "crates/lumis-wasm-runtime/src/**/*.rs",
  "crates/lumis-wasm-runtime/Cargo.toml",
  "languages.toml",
  "queries/processed/**/*.scm",
]
outputs = [
  "target/benchmarks/rust-target/release/lumis-size",
  "target/benchmarks/rust-target/release/syntect-size",
]

[tasks."build:cli"]
description = "Build the local Lumis CLI"
run = "cargo build --locked --release -p lumis-cli"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/lumis-cli/**/*",
  "crates/lumis-build/**/*",
  "crates/lumis-core/**/*",
  "crates/lumis-wasm-runtime/**/*",
  "languages.toml",
  "queries/processed/**/*.scm",
]
outputs = ["target/benchmarks/rust-target/release/lumis"]

[tasks."build:elixir"]
description = "Build the local Elixir package and install Benchee dependencies"
depends = ["install", "prepare:languages"]
run = "MIX_ENV=prod MIX_INSTALL_FORCE=1 BENCH_INSTALL_ONLY=1 elixir benchmarks/elixir/scenario.exs"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "benchmarks/elixir/mix.lock",
  "benchmarks/elixir/runtime.exs",
  "benchmarks/elixir/scenario.exs",
  "packages/elixir/lumis/lib/**/*.ex",
  "packages/elixir/lumis/mix.exs",
  "packages/elixir/lumis/native/lumis_nif/Cargo.toml",
  "packages/elixir/lumis/native/lumis_nif/src/**/*.rs",
  "crates/lumis-core/src/**/*.rs",
  "crates/lumis-core/Cargo.toml",
  "crates/lumis-wasm-runtime/src/**/*.rs",
  "crates/lumis-wasm-runtime/Cargo.toml",
]

[tasks."prepare:cli"]
description = "Prepare and validate the CLI parser cache"
depends = ["prepare:languages", "fixtures", "build:cli"]
run = "node benchmarks/scripts/prepare-cli.mjs"

[tasks."prepare:showcase"]
description = "Download and verify pinned visual comparison assets"
run = "node benchmarks/scripts/prepare-showcase.mjs"
sources = [
  "benchmarks/scripts/prepare-showcase.mjs",
  "benchmarks/webgpu_compute_reduce.html",
  "benchmarks/ripgrep_searcher.rs",
]
outputs = [
  "benchmarks/showcase/generated/assets/webgpu_compute_reduce.html",
  "benchmarks/showcase/generated/assets/ripgrep_searcher.rs",
  "benchmarks/showcase/generated/assets/catppuccin-latte.tmTheme",
  "benchmarks/showcase/generated/assets/catppuccin-frappe.tmTheme",
  "benchmarks/showcase/generated/assets/themes.json",
]

[tasks.showcase]
description = "Generate the visual output comparison gallery"
depends = [
  "build:javascript",
  "build:elixir",
  "prepare:cli",
  "prepare:showcase",
]
run = '''
export BENCH_SHOWCASE_DIR="$MISE_CONFIG_ROOT/showcase/generated"
export LUMIS_DATA_DIR="$MISE_CONFIG_ROOT/../target/benchmarks/cli/data"
cargo run --manifest-path benchmarks/rust/Cargo.toml --bin showcase
LUMIS_TEST_RUNTIME=wasm pnpm --filter @lumis-sh/benchmarks run showcase
LUMIS_TEST_RUNTIME=native BENCH_SHOWCASE_LUMIS_ONLY=1 pnpm --filter @lumis-sh/benchmarks run showcase
MIX_ENV=prod elixir benchmarks/elixir/showcase.exs
node benchmarks/scripts/finish-showcase.mjs
'''

[tasks."showcase-publish"]
description = "Copy the visual comparison into the website as static assets"
depends = ["showcase"]
run = "node benchmarks/scripts/publish-showcase.mjs"

[tasks.build]
description = "Build every benchmark implementation"
depends = [
  "build:javascript",
  "build:rust",
  "build:rust-sizes",
  "build:elixir",
  "prepare:cli",
]

[tasks.setup]
description = "Install and build the benchmark suite"
depends = ["install", "build"]

[tasks.format]
description = "Format benchmark code"
depends = ["install"]
run = '''
cargo fmt --manifest-path benchmarks/rust/Cargo.toml
pnpm --filter @lumis-sh/benchmarks run fmt
mix format benchmarks/elixir/runtime.exs benchmarks/elixir/scenario.exs benchmarks/elixir/showcase.exs
'''

[tasks."format:check"]
description = "Check benchmark formatting"
depends = ["install"]
run = '''
cargo fmt --manifest-path benchmarks/rust/Cargo.toml -- --check
pnpm --filter @lumis-sh/benchmarks run fmt:check
mix format --check-formatted benchmarks/elixir/runtime.exs benchmarks/elixir/scenario.exs benchmarks/elixir/showcase.exs
'''

[tasks.lint]
description = "Lint benchmark code"
depends = ["format:check"]
run = '''
cargo clippy --manifest-path benchmarks/rust/Cargo.toml --all-targets -- -D warnings
pnpm --filter @lumis-sh/benchmarks run lint
'''

[tasks."sync-language-deps"]
description = "Point the benchmark language packages at the versions the catalog pins"
run = "node benchmarks/scripts/sync-language-deps.mjs"
dir = "{{config_root}}/.."

[tasks."check-language-deps"]
description = "Verify the benchmark language packages match the catalog pins"
run = "node benchmarks/scripts/sync-language-deps.mjs --check"
dir = "{{config_root}}/.."

[tasks.check]
description = "Verify fixtures, formatting, lint, and optimized builds"
depends = ["build", "lint", "check-language-deps"]

[tasks.rust]
description = "Run Criterion for Lumis Rust and syntect"
depends = ["build:rust", "fixtures"]
run = '''
rm -rf "$CARGO_TARGET_DIR/criterion" "$BENCH_RUN_DIR/criterion"
mkdir -p "$BENCH_RUN_DIR"
BENCH_METADATA_DIR="$BENCH_RUN_DIR" cargo bench --manifest-path benchmarks/rust/Cargo.toml --bench scenarios -- --noplot
cp -R "$CARGO_TARGET_DIR/criterion" "$BENCH_RUN_DIR/criterion"
'''

[tasks.javascript]
description = "Run Mitata for Lumis JS Node and Wasm, Shiki, and highlight.js"
depends = ["build:javascript", "prepare:languages", "fixtures"]
run = '''
for implementation in lumis-js-node lumis-js-wasm shiki highlight-js; do
  for scenario in small-one-language large-one-language ten-files-one-language ten-files-ten-languages; do
    output="$BENCH_RUN_DIR/javascript/$implementation/$scenario.json"
    BENCH_IMPLEMENTATION="$implementation" BENCH_SCENARIO="$scenario" BENCH_OUTPUT="$output" pnpm --filter @lumis-sh/benchmarks run benchmark
  done
done
'''

[tasks.elixir]
description = "Run Benchee for Lumis Elixir"
depends = ["build:elixir", "prepare:languages", "fixtures"]
run = '''
mkdir -p "$BENCH_RUN_DIR/elixir"
for scenario in small-one-language large-one-language ten-files-one-language ten-files-ten-languages; do
  MIX_ENV=prod BENCH_SCENARIO="$scenario" BENCH_OUTPUT="$BENCH_RUN_DIR/elixir/$scenario.json" BENCH_METADATA_OUTPUT="$BENCH_RUN_DIR/elixir/$scenario-metadata.json" elixir benchmarks/elixir/scenario.exs
done
'''

[tasks.cli]
description = "Run Hyperfine for Lumis CLI and bat"
depends = ["prepare:cli", "fixtures"]
run = '''
cli_root="$MISE_CONFIG_ROOT/../target/benchmarks/cli"
mkdir -p "$BENCH_RUN_DIR/cli"
cp "$cli_root/metadata.json" "$BENCH_RUN_DIR/cli/metadata.json"
export XDG_CACHE_HOME="$cli_root/xdg-cache"
export LUMIS_DATA_DIR="$cli_root/data"
export LUMIS_CONFIG="$cli_root/missing-config.toml"
export BAT_OPTS=""
export BAT_PAGER="cat"
export PAGER="cat"
export CLICOLOR_FORCE="1"
unset NO_COLOR
for scenario in small-one-language large-one-language ten-files-one-language ten-files-ten-languages; do
  . "$cli_root/commands/$scenario.sh"
  hyperfine \
    --output=null \
    --style=basic \
    --warmup "${BENCH_WARMUP:-1}" \
    --min-runs "${BENCH_RUNS:-5}" \
    --export-json "$BENCH_RUN_DIR/cli/$scenario.json" \
    --command-name lumis-cli "$LUMIS_CLI_COMMAND" \
    --command-name bat "$BAT_COMMAND"
done
'''

[tasks.merge]
description = "Merge Total results and validate execution metadata"
run = "node benchmarks/scripts/merge-results.mjs"

[tasks."results-publish"]
description = "Copy the merged timing report into the website as static assets"
run = "node benchmarks/scripts/publish-benchmarks.mjs"

[tasks."package-sizes"]
description = "Measure comparable local release and package artifacts"
depends = ["install", "build:javascript", "build:rust-sizes", "build:cli", "build:elixir"]
run = 'BAT_BINARY="$(command -v bat)" node benchmarks/scripts/measure-package-sizes.mjs'

[tasks."package-size:javascript"]
description = "Measure JavaScript and Shiki package artifacts"
depends = ["build:javascript"]
env = { BENCH_PACKAGE_SIZE_GROUP = "javascript" }
run = "node benchmarks/scripts/measure-package-sizes.mjs"

[tasks."package-size:rust"]
description = "Measure Rust and syntect release artifacts"
depends = ["build:rust-sizes"]
env = { BENCH_PACKAGE_SIZE_GROUP = "rust" }
run = "node benchmarks/scripts/measure-package-sizes.mjs"

[tasks."package-size:cli"]
description = "Measure Lumis CLI and bat release artifacts"
depends = ["build:cli"]
env = { BENCH_PACKAGE_SIZE_GROUP = "cli" }
run = 'BAT_BINARY="$(command -v bat)" node benchmarks/scripts/measure-package-sizes.mjs'

[tasks."package-size:elixir"]
description = "Measure the Elixir NIF release artifact"
depends = ["build:elixir"]
env = { BENCH_PACKAGE_SIZE_GROUP = "elixir" }
run = "node benchmarks/scripts/measure-package-sizes.mjs"

[tasks."merge:package-sizes"]
description = "Merge and validate parallel package-size reports"
run = "node benchmarks/scripts/merge-package-sizes.mjs"

[tasks.run]
description = "Run all four benchmark scenarios"
depends = ["build"]
run = '''
rm -rf "$BENCH_RUN_DIR"
mkdir -p "$BENCH_RUN_DIR"
mise run --skip-deps -C "$MISE_CONFIG_ROOT" rust
mise run --skip-deps -C "$MISE_CONFIG_ROOT" javascript
mise run --skip-deps -C "$MISE_CONFIG_ROOT" elixir
mise run --skip-deps -C "$MISE_CONFIG_ROOT" cli
mise run --skip-deps -C "$MISE_CONFIG_ROOT" package-sizes
mise run --skip-deps -C "$MISE_CONFIG_ROOT" merge
'''
